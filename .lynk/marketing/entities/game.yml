metrics:
- name: count_games
  description: Count of games played
  sql: COUNT(*)
  examples: []
  comments:
  - Use for analyzing game volume and scheduling patterns.
  - Filter by season_type to compare Regular Season vs Playoffs.
  summary: null
- name: total_game_points_scored
  description: Total points scored across all games
  sql: SUM(COALESCE({total_game_points}, {pts_home} + {pts_away}))
  examples: []
  comments:
  - Aggregates all points scored in games, using player statistics when available.
  - Falls back to direct game points for games without player stats (e.g., All-Star
    games).
  - Useful for analyzing total offensive output across periods.
  summary: null
- name: avg_game_points_scored
  description: Average points scored per game
  sql: AVG(COALESCE({total_game_points}, {pts_home} + {pts_away}))
  examples: []
  comments:
  - Calculates average scoring per game, using player statistics when available.
  - Falls back to direct game points for games without player stats (e.g., All-Star
    games).
  - Useful for analyzing pace and offensive trends over time.
  summary: null
- name: count_assignments
  description: Total number of officials assigned across all games
  sql: SUM({officials_per_game})
  examples: []
  comments:
  - Aggregates officials assignments across games.
  - Useful for referee assignment analysis.
  summary: null
- name: avg_officials_assigned
  description: Average number of officials assigned per game
  sql: AVG({officials_per_game})
  examples: []
  comments:
  - Metrics average officiating capacity per game.
  - Useful for understanding referee assignment patterns.
  summary: null
- name: avg_total_points
  description: Average total points scored per game (home + away teams)
  sql: AVG({pts_home} + {pts_away})
  examples: []
  comments:
  - Key metric for analyzing offensive trends and game pace.
  - Higher values indicate more offensive-oriented games.
  summary: null
- name: sum_total_points
  description: Sum of total points scored across all games
  sql: SUM({pts_home} + {pts_away})
  examples: []
  comments:
  - Use for total scoring volume analysis.
  summary: null
- name: avg_q4_scoring_home
  description: Average 4th quarter points by home team, aggregated by team
  sql: AVG({q4_points_home_game})
  examples: []
  comments:
  - Team-level aggregation over per-game home Q4 scoring metric.
  summary: null
- name: avg_q4_scoring_away
  description: Average 4th quarter points by away team, aggregated by team
  sql: AVG({q4_points_away_game})
  examples: []
  comments:
  - Team-level aggregation over per-game away Q4 scoring metric.
  summary: null
- name: avg_point_differential
  description: Average point differential (home team points - away team points)
  sql: AVG({pts_home} - {pts_away})
  examples: []
  comments:
  - Positive values indicate home team advantage.
  - Use to analyze home court advantage and team dominance.
  summary: null
- name: avg_field_goal_percentage
  description: Average field goal percentage across both teams
  sql: AVG(({fg_pct_home} + {fg_pct_away}) / 2)
  examples: []
  comments:
  - Metrics overall shooting efficiency in games.
  - Higher percentages indicate better offensive execution.
  summary: null
- name: avg_three_point_percentage
  description: Average three-point percentage across both teams
  sql: AVG((CAST({fg3_pct_home} AS DECIMAL) + CAST({fg3_pct_away} AS DECIMAL)) / 2)
  examples: []
  comments:
  - Metrics three-point shooting efficiency.
  - 'Note: Some fg3_pct fields may be stored as strings.'
  summary: null
- name: avg_possessions
  description: Average estimated possessions per game (based on field goal attempts
    and free throw attempts)
  sql: AVG(({fga_home} + {fga_away}) + 0.44 * ({fta_home} + {fta_away}))
  examples: []
  comments:
  - Estimates game pace using field goal and free throw attempts.
  - Higher values indicate faster-paced games.
  summary: null
- name: avg_total_rebounds
  description: Average total rebounds per game (home + away teams)
  sql: AVG({reb_home} + {reb_away})
  examples: []
  comments:
  - Metrics overall rebounding activity in games.
  summary: null
- name: avg_total_assists
  description: Average total assists per game (home + away teams)
  sql: AVG({ast_home} + {ast_away})
  examples: []
  comments:
  - Metrics ball movement and team play.
  summary: null
- name: home_win_percentage
  description: Percentage of games won by home teams
  sql: |
    AVG(CASE WHEN {wl_home} = 'W' THEN 1 ELSE 0 END) * 100
  examples: []
  comments:
  - Metrics home court advantage effectiveness.
  - Values above 50% indicate home court advantage.
  summary: null
- name: avg_game_minutes
  description: Average minutes played per game
  sql: AVG({min})
  examples: []
  comments:
  - Metrics actual game duration in minutes.
  - Useful for scheduling and broadcast planning.
  summary: null
- name: total_away_wins
  description: Total wins for teams playing away
  sql: |
    SUM(CASE WHEN {wl_away} = 'W' THEN 1 ELSE 0 END)
  examples: []
  comments:
  - Counts total away wins for win-loss analysis.
  summary: null
- name: total_away_losses
  description: Total losses for teams playing away
  sql: |
    SUM(CASE WHEN {wl_away} = 'L' THEN 1 ELSE 0 END)
  examples: []
  comments:
  - Counts total away losses for win-loss analysis.
  summary: null
- name: total_home_wins
  description: Wins per team per season
  sql: |
    SUM(CASE WHEN {wl_home} = 'W' THEN 1 ELSE 0 END)
  examples: []
  comments:
  - Seasonal win totals for team performance analysis.
  summary: null
- name: total_home_losses
  description: Losses per team per season
  sql: |
    SUM(CASE WHEN {wl_home} = 'L' THEN 1 ELSE 0 END)
  examples: []
  comments:
  - Seasonal loss totals for team performance analysis.
  summary: null
- name: away_win_percentage
  description: Away game win percentage
  sql: |
    AVG(CASE WHEN {wl_away} = 'W' THEN 1.0 ELSE 0.0 END)
  examples: []
  comments:
  - Metrics performance away from home court.
  summary: null
- name: home_court_advantage
  description: Difference between home and away win percentages
  sql: "(AVG(CASE WHEN {wl_home} = 'W' THEN 1.0 ELSE 0.0 END) - \n    AVG(CASE WHEN\
    \ {wl_away} = 'W' THEN 1.0 ELSE 0.0 END))\n"
  examples: []
  comments:
  - Quantifies home court advantage effect.
  summary: null
- name: avg_attendance
  description: Average game attendance
  sql: AVG({attendance})
  examples: []
  comments:
  - Metrics fan engagement through attendance.
  summary: null
- name: max_attendance
  description: Maximum game attendance
  sql: MAX({attendance})
  examples: []
  comments:
  - Tracks peak attendance figures.
  summary: null
- name: avg_margin_of_victory
  description: Average margin of victory (absolute point differential)
  sql: AVG(ABS({pts_home} - {pts_away}))
  examples: []
  comments:
  - Metrics competitiveness of games.
