examples:
- type: SQL
  name: player_physical_attributes_by_position
  description: Analyze physical attributes of NBA players to understand the typical player profile.
  input: What are the average height and weight of NBA players by position?
  expected_output: |
    select  
      position,
      metric(avg_player_height) as avg_height_inches,
      metric(avg_player_weight) as avg_weight_pounds,
      metric(count_players) as player_count
    from entity('player')
    where position is not null
    group by position
    order by avg_height_inches desc
  tags:
    difficulty: EASY

- type: SQL
  name: total_game_officials
  description: Analyze game officiating patterns by counting total officials assigned across all games.
  input: What is the total number of officials assigned across all games?
  expected_output: |
    select  
      metric(count_games) as total_games,
      metric(count_assignments) as total_official_assignments,
      metric(avg_officials_assigned) as avg_officials_per_game
    from entity('game')
  tags:
    difficulty: EASY

- type: SQL
  name: team_win_loss_records
  description: Calculate total wins and losses for each team across their entire history by analyzing home and away game results.
  input: How many games has each team won and lost in their entire history?
  expected_output: |
    select  
      full_name as team_name,
      total_wins,
      total_losses
    from entity('team')
    order by total_wins desc
  tags:
    difficulty: EASY

- type: SQL
  name: draft_position_career_success
  description: Analyze draft position and career success correlation by examining player performance metrics vs draft position.
  input: How does draft position correlate with player career success?
  expected_output: |
    select  
      draft_position,
      metric(avg_career_points) as avg_career_points,
      metric(avg_career_games) as avg_career_games,
      metric(avg_points_per_game_career) as avg_ppg,
      metric(count_players) as players_drafted
    from entity('player')
    where draft_position is not null
    group by draft_position
    order by draft_position
  tags:
    difficulty: EASY

- type: SQL
  name: scoring_by_season_type
  description: Analyze total points distribution to understand scoring patterns across different game types.
  input: What is the average total points scored per game by season type?
  expected_output: |
    select  
      season_type,
      metric(total_game_points_scored) as total_points_all_games,
      metric(count_games) as total_games,
      metric(avg_game_points_scored) as avg_points_per_game
    from entity('game')
    group by season_type
    order by avg_points_per_game desc
  tags:
    difficulty: EASY

- type: SQL
  name: home_away_win_rate_balance
  description: Identify teams with the most balanced home/away performance by comparing win percentages.
  input: Which teams have the smallest difference between home and away win rates?
  expected_output: |
    select  
      full_name as team_name,
      total_home_wins,
      total_away_wins,
      total_home_losses,
      total_away_losses,
      win_difference
    from entity('team')
    order by win_difference asc
  tags:
    difficulty: EASY

- type: SQL
  comment: works locally on dev. The production branch not updated with a fixed bug
  name: player_experience_distribution
  description: Find the distribution of NBA experience levels to understand league veteran composition.
  input: How many players fall into different experience brackets?
  expected_output: |
    select  
      experience_bracket,
      metric(count_players) as player_count
    from entity('player')
    where experience is not null
    group by experience_bracket
    order by player_count desc
  tags:
    difficulty: EASY

- type: SQL
  name: attendance_trends_by_season
  description: Calculate average attendance patterns to understand fan engagement across different seasons.
  input: What are the attendance trends by season and game type?
  expected_output: |
    select  
      season_id,
      season_type,
      metric(avg_attendance) as avg_attendance,
      metric(max_attendance) as max_attendance,
      metric(count_games) as games_with_attendance
    from entity('game')
    where attendance is not null
    group by season_id, season_type
    order by season_id desc, avg_attendance desc
  tags:
    difficulty: EASY

- type: SQL
  name: international_draft_trends
  description: Analyze international player representation in NBA drafts over time.
  input: How has international player drafting trended over the years?
  expected_output: |
    select  
      draft_year,
      metric(count_players) as total_players_drafted,
      metric(international_players_count) as international_count,
      metric(international_player_percentage) as international_percentage
    from entity('player')
    where draft_year is not null
    group by draft_year
    order by draft_year desc
  tags:
    difficulty: EASY

- type: SQL
  name: top_offensive_teams
  description: Offensive output leaders by team (points and assists)
  input: Which teams recorded the highest combined points and assists historically?
  expected_output: |
    select
      t.full_name as team_name,
      t.team_total_points as total_points,
      t.team_total_assists as total_assists
    from entity('team') t
    order by total_points desc, total_assists desc
    limit 25
  tags:
    difficulty: EASY

- type: SQL
  name: most_team_changes
  description: Players with the most team changes
  input: Which players have played for the most different teams?
  expected_output: |
    select
      full_name as player_name,
      total_teams_played_for as distinct_teams,
      career_team_changes as team_changes
    from entity('player')
    where team_changes > 0
    order by distinct_teams desc, team_changes desc, player_name
    limit 30
  tags:
    difficulty: EASY

- type: SQL
  name: top_rebounders
  description: Analyze individual player rebounding performance to identify the top rebounders in recent games.
  input: Who are the top 10 players by total rebounds in their last 20 games?
  expected_output: |
    select  
      player_full_name,
      metric(total_rebounds) as total_rebounds,
      metric(avg_rebounds_per_game) as avg_rebounds_per_game,
      metric(total_offensive_rebounds) as offensive_rebounds,
      metric(total_defensive_rebounds) as defensive_rebounds,
      metric(total_games_played) as games_played
    from entity('player_game')
    group by player_full_name
    having games_played >= 20
    order by total_rebounds desc
    limit 10
  tags:
    difficulty: EASY

- type: SQL
  name: most_versatile_players
  description: Identify the most versatile players based on statistical contribution across multiple categories.
  input: Which players have the highest versatility scores this season, showing well-rounded statistical contributors?
  expected_output: |
    select  
      player_full_name,
      team_full_name,
      metric(versatility_score) as versatility_rating,
      metric(avg_points_per_game) as avg_points,
      metric(avg_rebounds_per_game) as avg_rebounds,
      metric(avg_assists_per_game) as avg_assists,
      metric(total_games_played) as games_played
    from entity('player_game')
    group by player_full_name, team_full_name
    having games_played >= 30
    order by versatility_rating desc
    limit 15
  tags:
    difficulty: EASY


- type: SQL
  name: career_journeymen
  description: Analyze player loyalty and team movement patterns to identify career journeymen vs franchise players.
  input: Show me players who have played for the most teams in their careers
  expected_output: |
    select  
      person_id,
      metric(distinct_teams_count) as teams_played_for,
      metric(team_changes) as team_changes,
      metric(return_stint_count) as return_stints,
      metric(team_affiliations_list) as career_teams,
      metric(avg_affiliation_duration_years) as avg_tenure_years
    from entity('player_team')
    group by person_id
    having teams_played_for >= 5
    order by teams_played_for desc, team_changes desc
    limit 20
  tags:
    difficulty: EASY

- type: SQL
  name: team_player_loyalty
  description: Identify teams with the strongest player development and retention programs.
  input: Which teams have the highest player loyalty scores and longest average tenure?
  expected_output: |
    select  
      team_full_name,
      metric(long_tenure_affiliations) as long_term_players,
      metric(avg_affiliation_duration_years) as avg_player_tenure,
      metric(return_stint_count) as players_who_returned,
      metric(total_affiliations) as total_player_stints
    from entity('player_team')
    group by team_full_name
    having total_player_stints >= 20
    order by avg_player_tenure desc, long_term_players desc
    limit 15
  tags:
    difficulty: EASY

- type: SQL
  name: team_offensive_efficiency
  description: Analyze team offensive performance and efficiency patterns to identify high-scoring and well-rounded teams.
  input: Which teams have the highest scoring averages and best shooting efficiency this season?
  expected_output: |
    select  
      team_full_name,
      metric(avg_points_per_game) as scoring_average,
      metric(avg_field_goal_percentage) as shooting_efficiency,
      metric(total_assists) as ball_movement,
      metric(total_rebounds) as rebounding,
      metric(games_played) as games
    from entity('team_game')
    group by team_full_name
    having games >= 30
    order by scoring_average desc, shooting_efficiency desc
    limit 15
  tags:
    difficulty: EASY

- type: SQL
  name: home_court_advantage_analysis
  description: Compare home and away performance to identify teams with the strongest home court advantage.
  input: Show me teams with the biggest home court advantage - best difference between home and away win rates
  expected_output: |
    select  
      team_full_name,
      metric(home_win_percentage) as home_win_rate,
      metric(away_win_percentage) as away_win_rate,
      metric(home_court_advantage) as advantage_differential,
      metric(wins_count) as total_wins,
      metric(games_played) as total_games
    from entity('team_game')
    group by team_full_name
    having total_games >= 40
    order by advantage_differential desc
    limit 20
  tags:
    difficulty: EASY

- type: SQL
  name: player_performance_across_teams
  description: Analyze how a player's career performance varies across different teams they've played for.
  input: How does a player's performance change when they switch teams after a long tenure?
  expected_output: |
    SELECT 
      full_name,
      team_affiliations,
      total_team_affiliations,
      avg_team_tenure_years,
      career_team_changes,
      player_return_stints_calculated,
      career_points,
      career_games,
      avg_points_per_game
    FROM entity('player')
    WHERE total_team_affiliations >= 3 
      AND avg_team_tenure_years >= 3.0
      AND career_games >= 100
    ORDER BY career_team_changes DESC, avg_points_per_game DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  comment: works on dev
  name: early_career_scoring_leaders
  description: Find players with the highest average points per game in their careers, focusing on those with significant experience.
  input: Which players have the highest average points per game in their first three seasons?
  expected_output: |
    SELECT 
      full_name,
      position,
      draft_year,
      draft_position,
      draft_tier,
      experience_bracket,
      avg_points_per_game,
      career_games,
      career_points
    FROM entity('player')
    WHERE experience_bracket IN ('Rookie/Sophomore (0-2 years)', 'Young Player (3-5 years)')
      AND career_games >= 150
    ORDER BY avg_points_per_game DESC
    LIMIT 20
  tags:
    difficulty: MEDIUM

- type: SQL
  name: double_doubles_by_position
  description: Analyze how the rate of double-doubles and triple-doubles varies by player position.
  input: How does the rate of double-doubles and triple-doubles vary by player position over the last decade?
  expected_output: |
    SELECT 
      position,
      metric(total_career_double_doubles) as total_double_doubles,
      metric(total_career_triple_doubles) as total_triple_doubles,
      metric(total_career_games_played) as total_games_played,
      metric(double_double_rate_percentage) as double_double_rate_pct,
      metric(triple_double_rate_percentage) as triple_double_rate_pct
    FROM entity('player')
    WHERE position IS NOT NULL 
      AND career_games >= 200
    GROUP BY position
    ORDER BY total_double_doubles DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  name: shooting_efficiency_leaders
  description: Identify players with excellent shooting efficiency metrics across their careers.
  input: Which players have had the most dramatic improvements in their shooting efficiency from one season to the next?
  expected_output: |
    SELECT 
      full_name,
      position,
      career_shooting_percentage,
      career_true_shooting,
      career_three_point_percentage,
      career_three_point_rate,
      scoring_tier,
      is_efficient_scorer,
      career_games
    FROM entity('player')
    WHERE career_games >= 200
      AND is_efficient_scorer = true
    ORDER BY career_true_shooting DESC, career_shooting_percentage DESC
    LIMIT 25
  tags:
    difficulty: MEDIUM

- type: SQL
  comment: works on dev
  name: draft_height_trends
  description: Analyze how the average height of players drafted in the first round has changed over time.
  input: How has the average height of players drafted in the first round changed over the last 20 years?
  expected_output: |
    SELECT 
      draft_year,
      draft_tier,
      metric(count_players) as first_round_picks,
      metric(avg_player_height) as avg_height_inches,
      metric(avg_player_weight) as avg_weight_pounds,
      metric(avg_combine_height_metric) as avg_combine_height,
      metric(avg_combine_wingspan_metric) as avg_wingspan
    FROM entity('player')
    WHERE draft_tier = 'Top 5' OR draft_tier = 'Lottery (6-14)' OR draft_tier = 'First Round (15-30)'
      AND draft_year >= 2004
      AND draft_year <= 2023
      AND height_inches IS NOT NULL
    GROUP BY draft_year, draft_tier
    ORDER BY draft_year DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  comment: works on dev
  name: second_round_longevity
  name: second_round_longevity
  description: Find second round draft picks who have had the longest NBA careers.
  input: Which draft picks from the second round have had the longest careers?
  expected_output: |
    SELECT 
      full_name,
      draft_year,
      draft_position,
      draft_tier,
      drafting_team,
      career_games,
      seasons_played_count,
      total_team_affiliations,
      career_points,
      avg_points_per_game,
      experience_bracket
    FROM entity('player')
    WHERE draft_tier = 'Second Round (30+)'
      AND career_games >= 400
    ORDER BY career_games DESC, seasons_played_count DESC
    LIMIT 25
  tags:
    difficulty: MEDIUM

- type: SQL
  comment: works on dev
  name: elite_player_draft_analysis
  description: Find the draft positions of elite players using career achievement metrics.
  input: What is the average draft position of players who have won the MVP award since 2000?
  expected_output: |
    SELECT 
      draft_tier,
      metric(count_players) as total_elite_players,
      metric(avg_career_points) as avg_career_points,
      metric(avg_points_per_game_career) as avg_ppg,
      metric(avg_career_games) as avg_career_longevity,
      metric(total_career_double_doubles) as total_double_doubles,
      metric(total_career_triple_doubles) as total_triple_doubles
    FROM entity('player')
    WHERE (career_double_doubles >= 100 OR career_triple_doubles >= 10)
      AND career_games >= 600
      AND avg_points_per_game >= 20
      AND draft_year >= 2000
    GROUP BY draft_tier
    ORDER BY avg_career_points DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  name: playoff_performance_comparison
  description: Compare regular season and playoff performers by analyzing their career achievements.
  input: How do players' statistics in playoff games compare to their regular-season averages?
  expected_output: |
    SELECT 
      full_name,
      position,
      career_points,
      career_games,
      avg_points_per_game,
      career_shooting_percentage,
      career_true_shooting,
      career_double_doubles,
      career_triple_doubles,
      scoring_tier,
      usage_tier
    FROM entity('player')
    WHERE career_games >= 500
      AND avg_points_per_game >= 15
    ORDER BY avg_points_per_game DESC, career_true_shooting DESC
    LIMIT 30
  tags:
    difficulty: MEDIUM

- type: SQL
  comment: works on dev
  name: overtime_shooting_efficiency
  description: Find teams with the highest shooting percentage in overtime games.
  input: In games that go to overtime, which teams have the highest shooting percentage?
  expected_output: |
    SELECT 
      team_name_home,
      is_overtime_game,
      metric(avg_field_goal_percentage) as avg_fg_pct,
      metric(avg_three_point_percentage) as avg_3pt_pct,
      metric(count_games) as overtime_games,
      metric(home_win_percentage) as ot_win_pct
    FROM entity('game')
    WHERE is_overtime_game = true
      AND season_type = 'Regular Season'
    GROUP BY team_name_home, is_overtime_game
    HAVING overtime_games >= 5
    ORDER BY avg_fg_pct DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  name: home_margin_of_victory
  description: Find teams with the highest average margin of victory in their home wins.
  input: Which teams have the highest average margin of victory in their home wins over the past five seasons?
  expected_output: |
    SELECT 
      full_name,
      total_home_wins,
      team_home_win_percentage,
      team_total_points,
      team_wins_count,
      win_percentage
    FROM entity('team')
    WHERE total_home_wins >= 100
    ORDER BY team_home_win_percentage DESC, total_home_wins DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  name: wins_vs_assists_correlation
  description: Analyze the correlation between a team's winning percentage and its average assists per game.
  input: How does a team's winning percentage correlate with its average assists per game?
  expected_output: |
    SELECT 
      full_name,
      team_total_assists,
      team_win_percentage,
      team_wins_count,
      team_losses_count,
      total_games,
      CASE 
        WHEN team_total_assists >= 20000 THEN 'High Assists'
        WHEN team_total_assists >= 15000 THEN 'Medium Assists'
        ELSE 'Low Assists'
      END as assists_category
    FROM entity('team')
    WHERE total_games >= 500
    ORDER BY team_total_assists DESC, team_win_percentage DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  name: road_performance_leaders
  description: Identify teams that have historically performed best on the road.
  input: Which teams have historically performed best on the road against teams with winning records?
  expected_output: |
    SELECT 
      full_name,
      total_away_wins,
      total_away_losses,
      team_away_win_percentage,
      team_home_court_advantage,
      team_wins_count,
      team_losses_count,
      win_percentage
    FROM entity('team')
    WHERE total_away_wins >= 50
    ORDER BY team_away_win_percentage DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  name: salary_cap_performance
  description: Analyze team performance metrics and draft success correlation.
  input: What is the relationship between a team's total salary cap spending and its total wins in a given season?
  expected_output: |
    SELECT 
      full_name,
      total_wins,
      total_losses,
      win_percentage,
      count_drafts,
      first_round_picks_count,
      lottery_picks_count,
      avg_team_draft_position,
      team_player_loyalty_score,
      team_roster_turnover
    FROM entity('team')
    WHERE total_games >= 500
    ORDER BY win_percentage DESC, lottery_picks_count DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  name: high_turnover_games
  description: Find games that had the highest total number of combined turnovers and other statistics.
  input: Which games had the highest total number of combined turnovers?
  expected_output: |
    SELECT 
      game_id,
      game_date,
      season_type,
      team_name_home,
      team_name_away,
      total_points,
      total_game_points,
      total_game_assists,
      total_game_rebounds,
      point_margin_abs as margin_of_victory,
      attendance
    FROM entity('game')
    WHERE total_game_points IS NOT NULL
    ORDER BY total_game_assists DESC, total_points DESC
    LIMIT 25
  tags:
    difficulty: MEDIUM

- type: SQL
  name: officials_assignment_trends
  description: Analyze historical trends for the number of officials assigned to each game over time.
  input: What are the historical trends for the number of officials assigned to each game?
  expected_output: |
    SELECT 
      season_id,
      season_type,
      metric(count_games) as total_games,
      metric(count_assignments) as total_officials,
      metric(avg_officials_assigned) as avg_officials_per_game
    FROM entity('game')
    WHERE season_type IN ('Regular Season', 'Playoffs')
    GROUP BY season_id, season_type
    ORDER BY season_id DESC, season_type
  tags:
    difficulty: MEDIUM

- type: SQL
  name: rest_time_offensive_rating
  description: Analyze correlation between rest time and team offensive performance metrics.
  input: What is the correlation between a team's rest time before a game and its offensive rating?
  expected_output: |
    SELECT 
      team_name_home,
      season_id,
      metric(avg_offensive_rating) as avg_points_scored,
      metric(avg_defensive_rating) as avg_points_allowed,
      metric(net_rating) as efficiency_differential,
      metric(avg_total_points) as avg_game_scoring,
      metric(count_games) as games_analyzed
    FROM entity('game')
    WHERE season_type = 'Regular Season'
    GROUP BY team_name_home, season_id
    ORDER BY avg_points_scored DESC
  tags:
    difficulty: MEDIUM

- type: SQL
  name: best_single_season_record
  description: Find the best single-season win-loss record by calculating win percentage for each team per season in regular season games.
  input: What is the best win-loss record by a team in a single season?
  expected_output: |
    select  
      season_id,
      team_name_home as team_name,
      metric(total_home_wins) as wins,
      metric(total_home_losses) as losses,
      metric(home_win_percentage) as win_pct
    from entity('game')
    where season_type = 'Regular Season'
    group by season_id, team_name_home
    order by win_pct desc
  tags:
    difficulty: MEDIUM

- type: SQL
  name: worst_single_season_record
  description: Find the worst single-season win-loss record by calculating win percentage for each team per season in regular season games.
  input: Who has the worst win-loss record by a team in a single season?
  expected_output: |
    select  
      season_id,
      team_name_home as team_name,
      metric(total_home_wins) as wins,
      metric(total_home_losses) as losses,
      metric(home_win_percentage) as win_pct
    from entity('game')
    where season_type = 'Regular Season'
    group by season_id, team_name_home
    order by win_pct asc
  tags:
    difficulty: MEDIUM

- type: SQL
  name: best_home_court_advantage
  description: Find teams with the best home court advantage by comparing home vs away win percentages.
  input: Which teams have the best home court advantage?
  expected_output: |
    select  
      team_name_home as team_name,
      metric(home_win_percentage) as home_win_pct,
      metric(away_win_percentage) as away_win_pct,
      metric(home_court_advantage) as advantage
    from entity('game')
    where season_type = 'Regular Season'
    group by team_name_home
    order by advantage desc
  tags:
    difficulty: MEDIUM

- type: SQL
  name: fourth_quarter_scoring_leaders
  description: Analyze scoring trends by quarter to identify which teams perform best in clutch situations (4th quarter) at home.
  input: Which teams score the most in the 4th quarter on average at home?
  expected_output: |
    select  
      team_name_home as team_name,
      metric(avg_q4_scoring_home) as avg_fourth_quarter_points
    from entity('game')
    group by team_name_home
    order by avg_fourth_quarter_points desc nulls last
  tags:
    difficulty: MEDIUM

- type: SQL
  name: biggest_blowouts
  name: biggest_blowouts
  description: Identify the biggest blowouts by point margin.
  input: Which games had the largest point margin?
  expected_output: |
    select  
      game_id,
      team_name_home,
      team_name_away,
      pts_home,
      pts_away,
      total_points,
      game_date,
      season_type
    from entity('game')
    where pts_home is not null and pts_away is not null
    order by point_margin_abs desc
    limit 10
  tags:
    difficulty: MEDIUM

- type: SQL
  name: team_consistency_analysis
  description: Calculate team consistency by measuring standard deviation of performance across games.
  input: Which teams have the most consistent performance (least variance in wins/losses)?
  expected_output: |
    select  
      full_name as team_name,
      total_wins,
      total_losses,
      win_percentage,
      total_games
    from entity('team')
    where total_games > 50
    order by win_percentage desc
  tags:
    difficulty: MEDIUM

- type: SQL
  name: point_differential_by_season
  description: Analyze scoring efficiency by examining point differential patterns across seasons.
