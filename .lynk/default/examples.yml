  expected_output: |
    SELECT 
      season_year,
      regular_season_mvp,
      champion_team,
      defeated_team,
      CASE 
        WHEN regular_season_mvp IS NOT NULL AND champion_team IS NOT NULL THEN 'Regular season MVP data available'
        ELSE 'Data incomplete'
      END as mvp_championship_status
    FROM entity('season')
    WHERE regular_season_mvp IS NOT NULL
      AND champion_team IS NOT NULL
    ORDER BY season_year DESC;
  tags:
    difficulty: EASY

- type: SQL
  name: most_finals_mvp_awards
  description: Identify the player who has won the most Finals MVP awards throughout NBA history. Uses season_finals_mvp_to_player relationship.
  input: What is the player that won the most Finals MVP titles?
  expected_output: |
    SELECT 
      p.full_name as player_name,
      COUNT(*) as finals_mvp_count,
      MIN(s.season_year) as first_finals_mvp_year,
      MAX(s.season_year) as last_finals_mvp_year,
      STRING_AGG(CAST(s.season_year AS STRING), ', ' ORDER BY s.season_year) as finals_mvp_years
    FROM entity('season') s
    JOIN entity('player') p ON s.finals_mvp = p.full_name
    WHERE s.finals_mvp IS NOT NULL
    GROUP BY p.id, p.full_name
    ORDER BY finals_mvp_count DESC, first_finals_mvp_year ASC;
  tags:
    difficulty: EASY

- type: SQL
  name: most_regular_season_mvp_awards
  description: Identify the player who has won the most regular season MVP awards throughout NBA history. Uses season_regular_mvp_to_player relationship.
  input: What is the player that won the most regular season MVP titles?
  expected_output: |
    SELECT 
      p.full_name as player_name,
      COUNT(*) as mvp_count,
      MIN(s.season_year) as first_mvp_year,
      MAX(s.season_year) as last_mvp_year,
      STRING_AGG(CAST(s.season_year AS STRING), ', ' ORDER BY s.season_year) as mvp_years
    FROM entity('season') s
    JOIN entity('player') p ON s.regular_season_mvp = p.full_name
    WHERE s.regular_season_mvp IS NOT NULL
    GROUP BY p.id, p.full_name
    ORDER BY mvp_count DESC, first_mvp_year ASC;
  tags:
    difficulty: EASY

- type: SQL
  name: regular_season_mvp_championship_correlation
  description: Analyze the relationship between regular season MVP winners and championship success by examining how often regular season MVP players' teams win titles.
  input: How often do regular season MVP players' teams win the championship in the same season?
  expected_output: |
    SELECT 
      COUNT(*) as total_mvp_seasons,
      COUNT(CASE 
        WHEN regular_season_mvp IS NOT NULL AND champion_team IS NOT NULL THEN 1 
        ELSE NULL 
      END) as mvp_seasons_with_championship_data
    FROM entity('season')
    WHERE regular_season_mvp IS NOT NULL 
      AND champion_team IS NOT NULL;
  tags:
    difficulty: EASY

- type: SQL
  name: top_coaches_by_career
  description: Analyze coaching career longevity and success patterns by examining win percentages and career spans.
  input: Which coaches have the longest careers and highest win percentages?
  expected_output: |
    SELECT 
      coach_name,
      years_active,
      total_games_coached,
      total_wins,
      total_losses,
      win_percentage,
      total_head_coach_teams,
      career_wins_over_500
    FROM entity('coach')
    WHERE total_games_coached >= 100
    ORDER BY win_percentage DESC, years_active DESC
    LIMIT 20
  tags:
    difficulty: EASY

- type: SQL
  name: most_teams_coached
  description: Identify coaches who have worked for the most different teams throughout their careers.
  input: Which coaches have coached the most different teams in their careers?
  expected_output: |
    SELECT 
      coach_name,
      total_head_coach_teams,
      total_head_coach_seasons,
      total_assistant_seasons,
      years_active,
      first_year,
      last_year
    FROM entity('coach')
    WHERE total_head_coach_teams >= 3
    ORDER BY total_head_coach_teams DESC, total_head_coach_seasons DESC
    LIMIT 15
  tags:
    difficulty: EASY

- type: SQL
  name: coach_home_court_advantage
  description: Analyze coaching performance by comparing home and away win records for coaches.
  input: Which coaches have the best home court advantage with their teams?
  expected_output: |
    SELECT 
      coach_name,
      total_home_wins,
      total_away_wins,
      total_games_coached,
      win_percentage,
      avg_points_per_game,
      (total_home_wins - total_away_wins) as home_advantage_wins
    FROM entity('coach')
    WHERE total_games_coached >= 200
    ORDER BY home_advantage_wins DESC, win_percentage DESC
    LIMIT 15
  tags:
    difficulty: MEDIUM

- type: SQL
  name: assistant_to_head_coach_path
  description: Find coaches with the most successful assistant coaching experience before becoming head coaches.
  input: Which coaches had the most assistant coaching experience before becoming head coaches?
  expected_output: |
    SELECT 
      coach_name,
      total_assistant_seasons,
      total_head_coach_seasons,
      total_games_coached,
      win_percentage,
      years_active,
      CASE 
        WHEN total_assistant_seasons >= 10 THEN 'Extensive Assistant Experience'
        WHEN total_assistant_seasons >= 5 THEN 'Moderate Assistant Experience'
        ELSE 'Limited Assistant Experience'
      END as assistant_experience_level
    FROM entity('coach')
    WHERE total_assistant_seasons > 0 AND total_head_coach_seasons > 0
    ORDER BY total_assistant_seasons DESC, win_percentage DESC
    LIMIT 20
  tags:
    difficulty: MEDIUM