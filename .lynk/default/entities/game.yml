    field: fg3_pct_away
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: ftm_away
    data_type: number
    source: nba.public.game
    description: Free throws made by the away team
    field: ftm_away
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: fta_away
    data_type: number
    source: nba.public.game
    description: Free throw attempts by the away team
    field: fta_away
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: ft_pct_away
    data_type: number
    source: nba.public.game
    description: Free throw percentage for the away team
    field: ft_pct_away
    join_name: null
    time_field: null
    filters: [ ]

  # Scoring Statistics - Home Team
  - type: field
    name: pts_home
    data_type: number
    source: nba.public.game
    description: Total points scored by the home team
    field: pts_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: fgm_home
    data_type: number
    source: nba.public.game
    description: Field goals made by the home team
    field: fgm_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: fga_home
    data_type: number
    source: nba.public.game
    description: Field goal attempts by the home team
    field: fga_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: fg_pct_home
    data_type: number
