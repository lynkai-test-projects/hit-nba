    field: tov_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: pf_home
    data_type: number
    source: nba.public.game
    description: Personal fouls by the home team
    field: pf_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: plus_minus_home
    data_type: number
    source: nba.public.game
    description: Plus/minus rating for the home team
    field: plus_minus_home
    join_name: null
    time_field: null
    filters: [ ]

  # Game Outcome Fields
  - type: field
    name: wl_away
    data_type: string
    source: nba.public.game
    description: Win/Loss result for the away team (W or L)
    field: wl_away
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: wl_home
    data_type: string
    source: nba.public.game
    description: Win/Loss result for the home team (W or L)
    field: wl_home
    join_name: null
    time_field: null
    filters: [ ]

  # Media Availability Fields
  - type: field
    name: video_available_away
    data_type: number
    source: nba.public.game
    description: Whether video is available for the away team (1 = available, 0 = not available)
    field: video_available_away
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: video_available_home
    data_type: number
    source: nba.public.game
    description: Whether video is available for the home team (1 = available, 0 = not available)
    field: video_available_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: formula
    data_type: number
    name: season_year
    description: season year. use this when a user asks questions that require season.
    sql: 'substring({season_id}, 2)'

  # Formula Features - Calculated Fields
  - type: formula
    data_type: number
    name: total_points
    description: Total points scored in the game (home + away teams)
    sql: '{pts_home} + {pts_away}'

  # Game Scoring Delta Features
  - type: formula
    data_type: number
    name: point_margin
    description: Signed point margin (home team points minus away team points)
    sql: '{pts_home} - {pts_away}'

  - type: formula
    data_type: number
    name: point_margin_abs
    description: Absolute point margin for blowout detection
    sql: 'ABS({pts_home} - {pts_away})'

  # Line Score Fields (from nba.public.line_score - 1:1 relationship)
  # Home Team Quarter Points
  - type: field
    name: pts_qtr1_home
    description: Home team points in Q1
    data_type: number
    source: nba.public.line_score
    field: pts_qtr1_home
    join_name: game_id_line_score
    time_field: null
    filters: [ ]

  - type: field
    name: pts_qtr2_home
    description: Home team points in Q2
    data_type: number
    source: nba.public.line_score
    field: pts_qtr2_home
    join_name: game_id_line_score
    time_field: null
    filters: [ ]

  - type: field
    name: pts_qtr3_home
    description: Home team points in Q3
    data_type: number
    source: nba.public.line_score
    field: pts_qtr3_home
    join_name: game_id_line_score
    time_field: null
    filters: [ ]

  - type: field
    name: pts_qtr4_home
    description: Home team points in Q4
    data_type: number
    source: nba.public.line_score
    field: pts_qtr4_home
    join_name: game_id_line_score
    time_field: null
    filters: [ ]

  - type: field
    name: pts_ot1_home
    description: Home team points in OT1
    data_type: number
    source: nba.public.line_score
    field: pts_ot1_home
    join_name: game_id_line_score
    time_field: null
    filters: [ ]



  # Away Team Quarter Points
  - type: field
    name: pts_qtr1_away
    description: Away team points in Q1
    data_type: number
    source: nba.public.line_score
    field: pts_qtr1_away
    join_name: game_id_line_score
    time_field: null
    filters: [ ]

  - type: field
    name: pts_qtr2_away
    description: Away team points in Q2
    data_type: number
    source: nba.public.line_score
    field: pts_qtr2_away
    join_name: game_id_line_score
    time_field: null
    filters: [ ]

  - type: field
    name: pts_qtr3_away
    description: Away team points in Q3
    data_type: number
    source: nba.public.line_score
    field: pts_qtr3_away
    join_name: game_id_line_score
    time_field: null
    filters: [ ]

  - type: field
    name: pts_qtr4_away
    description: Away team points in Q4
    data_type: number
    source: nba.public.line_score
    field: pts_qtr4_away
    join_name: game_id_line_score
    time_field: null
    filters: [ ]

  - type: field
    name: pts_ot1_away
    description: Away team points in OT1
    data_type: number
    source: nba.public.line_score
    field: pts_ot1_away
    join_name: game_id_line_score
    time_field: null
    filters: [ ]

  # Line Score Formula Features (calculated from fields)
  - type: formula
    name: first_half_points_home
    description: Home team first half points (Q1 + Q2)
    data_type: number
    sql: '{pts_qtr1_home} + {pts_qtr2_home}'

  - type: formula
    name: second_half_points_home
    description: Home team second half points (Q3 + Q4)
    data_type: number
    sql: '{pts_qtr3_home} + {pts_qtr4_home}'

  - type: formula
    name: first_half_points_away
    description: Away team first half points (Q1 + Q2)
    data_type: number
    sql: '{pts_qtr1_away} + {pts_qtr2_away}'

  - type: formula
    name: second_half_points_away
    description: Away team second half points (Q3 + Q4)
    data_type: number
    sql: '{pts_qtr3_away} + {pts_qtr4_away}'

  # Overtime Detection Features (formula based on line_score fields)
  - type: formula
    data_type: boolean
    name: is_overtime_game
    description: Whether the game went to overtime (either team scored in OT1)
    sql: |
      CASE WHEN COALESCE({pts_ot1_home}, 0) > 0 OR COALESCE({pts_ot1_away}, 0) > 0 THEN TRUE ELSE FALSE END

  - type: formula
    name: home_team_won
    description: Whether the home team won the game
    data_type: boolean
    sql: 'CASE WHEN {pts_home} > {pts_away} THEN TRUE ELSE FALSE END'

  # Officials Features (from game_official entity)
  - type: metric
    name: officials_per_game
    description: Number of officials assigned to each game
    data_type: number
    source: game_official
    join_name: game_to_game_official
    time_field: null
    filters: [ ]
    metric: count_assignments

  # Other Stats Fields (from nba.public.other_stats - 1:1 relationship)
  # Game and League Identification
  - type: field
    name: league_id
    data_type: number
    source: nba.public.other_stats
