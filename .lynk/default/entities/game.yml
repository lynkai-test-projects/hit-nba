  - type: field
    name: lead_changes
    data_type: number
    source: nba.public.other_stats
    description: Number of lead changes in the game
    field: lead_changes
    join_name: game_id_other_stats
    time_field: null
    filters: [ ]

  - type: field
    name: times_tied
    data_type: number
    source: nba.public.other_stats
    description: Number of times the game was tied
    field: times_tied
