name: game

description: Dimension table containing comprehensive game information, tags, and categorization for NBA basketball games

key_table: nba.public.game

keys:
  - game_id

features:

  # Game Identification Fields
  - type: field
    name: game_id
    data_type: number
    source: nba.public.game
    description: Unique identifier for each NBA game
    field: game_id
    join_name: null
    time_field: null
    filters: [ ]

  # Game Date and Time Fields
  - type: field
    name: game_date
    data_type: datetime
    source: nba.public.game
    description: Date when the game was played
    field: game_date
    join_name: null
    time_field: null
    filters: [ ]

  # Season Information Fields
  - type: field
    name: season_id
    data_type: number
    source: nba.public.game
    description: Identifier for the NBA season (e.g., 2023 for 2023-24 season)
    field: season_id
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: season_type
    data_type: string
    source: nba.public.game
    description: Type of season game (Regular Season, Playoffs, All-Star, Pre Season)
    field: season_type
    join_name: null
    time_field: null
    filters: [ ]

  # Team Identification Fields - Away Team
  - type: field
    name: team_id_away
    data_type: number
    source: nba.public.game
    description: Unique identifier for the away team
    field: team_id_away
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: team_name_away
    data_type: string
    source: nba.public.game
    description: Full name of the away team
    field: team_name_away
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: team_abbreviation_away
    data_type: string
    source: nba.public.game
    description: Abbreviated name of the away team (e.g., LAL, BOS)
    field: team_abbreviation_away
    join_name: null
    time_field: null
    filters: [ ]

  # Team Identification Fields - Home Team
  - type: field
    name: team_id_home
    data_type: number
    source: nba.public.game
    description: Unique identifier for the home team
    field: team_id_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: team_name_home
    data_type: string
    source: nba.public.game
    description: Full name of the home team
    field: team_name_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: team_abbreviation_home
    data_type: string
    source: nba.public.game
    description: Abbreviated name of the home team (e.g., LAL, BOS)
    field: team_abbreviation_home
    join_name: null
    time_field: null
    filters: [ ]

  # Game Context Fields
  - type: field
    name: matchup_away
    data_type: string
    source: nba.public.game
    description: Matchup description for the away team (e.g., "vs. BOS")
    field: matchup_away
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: matchup_home
    data_type: string
    source: nba.public.game
    description: Matchup description for the home team (e.g., "vs. LAL")
    field: matchup_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
