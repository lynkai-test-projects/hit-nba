  # Other Statistics - Home Team
  - type: field
    name: ast_home
    data_type: number
    source: nba.public.game
    description: Assists by the home team
    field: ast_home
    join_name: null
    time_field: null
    filters: [ ]

  - type: field
    name: stl_home
    data_type: string
    source: nba.public.game
