    filters: [ ]

  - type: field
    name: pts_2nd_chance_away
    data_type: number
    source: nba.public.other_stats
    description: Away team second chance points
    field: pts_2nd_chance_away
    join_name: game_id_other_stats
    time_field: null
    filters: [ ]

  - type: field
    name: pts_fb_away
    data_type: number
    source: nba.public.other_stats
    description: Away team fast break points
    field: pts_fb_away
    join_name: game_id_other_stats
    time_field: null
    filters: [ ]

  - type: field
    name: largest_lead_away
    data_type: number
    source: nba.public.other_stats
    description: Away team's largest lead in the game
    field: largest_lead_away
    join_name: game_id_other_stats
    time_field: null
    filters: [ ]

  - type: field
    name: team_turnovers_away
    data_type: number
    source: nba.public.other_stats
    description: Away team turnovers
    field: team_turnovers_away
    join_name: game_id_other_stats
    time_field: null
    filters: [ ]

  - type: field
    name: total_turnovers_away
    data_type: number
    source: nba.public.other_stats
    description: Away team total turnovers
    field: total_turnovers_away
    join_name: game_id_other_stats
    time_field: null
    filters: [ ]

  - type: field
    name: team_rebounds_away
    data_type: number
    source: nba.public.other_stats
    description: Away team rebounds
    field: team_rebounds_away
    join_name: game_id_other_stats
    time_field: null
    filters: [ ]

  - type: field
    name: pts_off_to_away
    data_type: number
    source: nba.public.other_stats
    description: Away team points off turnovers
    field: pts_off_to_away
    join_name: game_id_other_stats
    time_field: null
    filters: [ ]

  # Formula Features (from other_stats asset fields array)
  - type: formula
    name: points_off_turnovers
    description: Points scored off opponent turnovers (combined home and away)
    data_type: number
    sql: 'COALESCE({pts_off_to_home}, 0) + COALESCE({pts_off_to_away}, 0)'

  - type: formula
    name: second_chance_points
    description: Second chance points (combined home and away)
    data_type: number
    sql: 'COALESCE({pts_2nd_chance_home}, 0) + COALESCE({pts_2nd_chance_away}, 0)'

  - type: formula
    name: fast_break_points
    description: Fast break points (combined home and away)
    data_type: number
    sql: 'COALESCE({pts_fb_home}, 0) + COALESCE({pts_fb_away}, 0)'

  # Game Info Features (from nba.public.game_info)
  - type: field
    name: attendance
    description: Reported attendance for the game
    data_type: number
    source: nba.public.game_info
    field: attendance
    join_name: game_id_info
    time_field: null
    filters: [ ]

  - type: field
    name: arena_name
    description: Name of the arena where the game was played
    data_type: string
    source: nba.public.game_info
    field: arena_name
    join_name: game_id_info
    time_field: null
    filters: [ ]

  - type: formula
    name: is_neutral_site
    description: Whether the game was played at a neutral site (not home team's arena)
    data_type: boolean
    sql: |
      CASE WHEN LOWER(COALESCE({arena_name}, '')) LIKE '%neutral%' THEN TRUE ELSE FALSE END

  # Game Summary Features (from nba.public.game_summary)
  - type: field
    name: game_date_est
    description: Game date in Eastern Standard Time
    data_type: datetime
    source: nba.public.game_summary
    field: GAME_DATE_EST
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  - type: field
    name: game_sequence
    description: Sequence number for the game (order within the day/season)
    data_type: number
    source: nba.public.game_summary
    field: GAME_SEQUENCE
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  - type: field
    name: game_status_id
    description: Numeric identifier for game status
    data_type: number
    source: nba.public.game_summary
    field: GAME_STATUS_ID
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  - type: field
    name: game_status_text
    description: Text description of game status (e.g., "Final", "Live", "Scheduled")
    data_type: string
    source: nba.public.game_summary
    field: GAME_STATUS_TEXT
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  - type: field
    name: gamecode
    description: Unique game code identifier
    data_type: string
    source: nba.public.game_summary
    field: GAMECODE
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  - type: field
    name: live_period
    description: Current period number if game is live (NULL if game is finished)
    data_type: number
    source: nba.public.game_summary
    field: LIVE_PERIOD
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  - type: field
    name: live_pc_time
    description: Live PC time remaining in current period (if game is live)
    data_type: string
    source: nba.public.game_summary
    field: LIVE_PC_TIME
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  - type: field
    name: natl_tv_broadcaster
    description: National TV broadcaster abbreviation (if game is nationally televised)
    data_type: string
    source: nba.public.game_summary
    field: NATL_TV_BROADCASTER_ABBREVIATION
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  - type: field
    name: live_period_time_bcast
    description: Live period time broadcast information
    data_type: string
    source: nba.public.game_summary
    field: LIVE_PERIOD_TIME_BCAST
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  - type: field
    name: wh_status
    description: Win/loss status indicator
    data_type: number
    source: nba.public.game_summary
    field: WH_STATUS
    join_name: game_id_summary
    time_field: null
    filters: [ ]

  # Calculated Fields from Game Summary
  - type: formula
    name: is_live_game
    data_type: boolean
    description: Whether the game is currently live (based on game status and live period)
    sql: |
      CASE 
        WHEN UPPER(COALESCE({game_status_text}, '')) = 'LIVE' OR {live_period} IS NOT NULL 
        THEN TRUE 
        ELSE FALSE 
      END

  - type: formula
    name: is_final_game
    data_type: boolean
    description: Whether the game is final/completed
    sql: |
      CASE 
        WHEN UPPER(COALESCE({game_status_text}, '')) = 'FINAL' 
        THEN TRUE 
        ELSE FALSE 
      END

  - type: formula
    name: is_scheduled_game
    data_type: boolean
    description: Whether the game is scheduled but not yet started
    sql: |
      CASE 
        WHEN UPPER(COALESCE({game_status_text}, '')) = 'SCHEDULED' 
        THEN TRUE 
        ELSE FALSE 
      END

  - type: formula
    name: is_nationally_televised
    data_type: boolean
    description: Whether the game is nationally televised
    sql: |
      CASE 
        WHEN {natl_tv_broadcaster} IS NOT NULL AND TRIM({natl_tv_broadcaster}) != '' 
        THEN TRUE 
        ELSE FALSE 
      END

  - type: formula
    name: game_status_category
    data_type: string
    description: Categorizes game status into groups (Live, Final, Scheduled, Other)
    sql: |
      CASE 
        WHEN UPPER(COALESCE({game_status_text}, '')) = 'LIVE' THEN 'Live'
        WHEN UPPER(COALESCE({game_status_text}, '')) = 'FINAL' THEN 'Final'
        WHEN UPPER(COALESCE({game_status_text}, '')) = 'SCHEDULED' THEN 'Scheduled'
        WHEN UPPER(COALESCE({game_status_text}, '')) LIKE '%POSTPONED%' THEN 'Postponed'
        WHEN UPPER(COALESCE({game_status_text}, '')) LIKE '%CANCELLED%' THEN 'Cancelled'
        ELSE 'Other'
      END

  # Game Statistics Features (from player_game_stats)
  - type: metric
    name: total_game_points
    description: Total points scored by all players in this game
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters: [ ]
    metric: total_points

  - type: metric
    name: total_game_assists
    description: Total assists by all players in this game
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters: [ ]
    metric: total_assists

  - type: metric
    name: total_game_rebounds
    description: Total rebounds by all players in this game
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters: [ ]
    metric: total_rebounds

  - type: metric
    name: game_double_doubles
    description: Number of double-doubles achieved in this game
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters: [ ]
    metric: double_doubles_count

  - type: metric
    name: game_triple_doubles
    description: Number of triple-doubles achieved in this game
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters: [ ]
    metric: triple_doubles_count

  # Coach Metrics from coaching_staff entity via coach-game relationship
  - type: metric
    name: total_coaches_involved
    data_type: number
    description: Total number of distinct head coaches involved in selected games
    source: coaching_staff
    join_name: game_coach_via_coaching_staff
    time_field: null
    filters:
      - type: field
        field: coach_type
        operator: equal
        values:
          - 'Head Coach'
    metric: total_coaches_count

  - type: metric
    name: coaching_matchups_count
    data_type: number
    source: coaching_staff
    description: Total number of head coach assignments in selected games
    join_name: game_coach_via_coaching_staff
    time_field: null
    filters:
      - type: field
        field: coach_type
        operator: equal
        values:
          - 'Head Coach'
    metric: head_coach_count

  # Dunk Statistics Features
  - type: metric
    name: total_dunks_in_game
    description: Total dunks made by all players in this game
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters: [ ]
    metric: total_dunks

  - type: metric
    name: players_with_dunks_in_game
    description: Number of players who made dunks in this game
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters: [ ]
    metric: players_with_dunks_count

  - type: metric
    name: max_dunks_by_single_player
    description: Maximum dunks made by a single player in this game
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters: [ ]
    metric: max_dunks_in_game

  - type: metric
    name: avg_dunks_in_game
    description: Average dunks per player in this game
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters: [ ]
    metric: avg_dunks

  - type: metric
    name: high_dunk_performance_games
    description: Games with 10+ total dunks
    data_type: number
    source: player_game
    join_name: null
    time_field: null
    filters:
      - type: field
        field: dunks
        operator: 'gte'
        values:
          - '10'
    metric: total_games_played

metrics:

  # Game Volume Metrics
  - name: count_games
    description: |
      Count of games played
      - "Use for analyzing game volume and scheduling patterns."
      - "Unless specified otherwise, always add the filter : season_type NOT IN ('Pre Season', 'All-Star')."
    sql: 'COUNT(*)'

  - name: total_game_points_scored
    description: |
      Total points scored across all games
      - "Aggregates all points scored in games, using player statistics when available."
      - "Falls back to direct game points for games without player stats (e.g., All-Star games)."
      - "Useful for analyzing total offensive output across periods."
    sql: 'SUM(COALESCE({total_game_points}, {pts_home} + {pts_away}))'

  - name: avg_game_points_scored
    description: |
      Average points scored per game
      - "Calculates average scoring per game, using player statistics when available."
      - "Falls back to direct game points for games without player stats (e.g., All-Star games)."
      - "Useful for analyzing pace and offensive trends over time."
    sql: 'AVG(COALESCE({total_game_points}, {pts_home} + {pts_away}))'

  # Officials Metrics
  - name: count_assignments
    description: |
      Total number of officials assigned across all games
      - "Aggregates officials assignments across games."
      - "Useful for referee assignment analysis."
    sql: 'SUM({officials_per_game})'

  - name: avg_officials_assigned
    description: |
      Average number of officials assigned per game
      - "Metrics average officiating capacity per game."
      - "Useful for understanding referee assignment patterns."
    sql: 'AVG({officials_per_game})'

  # Scoring Metrics
  - name: avg_total_points
    description: |
      Average total points scored per game (home + away teams)
      - "Key metric for analyzing offensive trends and game pace."
      - "Higher values indicate more offensive-oriented games."
    sql: 'AVG({pts_home} + {pts_away})'

  - name: sum_total_points
    description: |
      Sum of total points scored across all games
      - "Use for total scoring volume analysis."
    sql: 'SUM({pts_home} + {pts_away})'

  # Line Score Metrics (from nba.public.line_score)
  - name: avg_q4_scoring_home
    description: |
      Average home team Q4 points
      - "Average 4th quarter scoring by home teams across all games."
      - "Useful for analyzing clutch performance and late-game execution."
    sql: 'AVG({pts_qtr4_home})'

  - name: avg_q4_scoring_away
    description: |
      Average away team Q4 points
      - "Average 4th quarter scoring by away teams across all games."
      - "Useful for analyzing clutch performance and late-game execution."
    sql: 'AVG({pts_qtr4_away})'

  - name: avg_first_half_scoring_home
    description: |
      Average home team first half points
      - "Average first half scoring by home teams."
      - "Useful for analyzing game starts and early performance."
    sql: 'AVG({first_half_points_home})'

  - name: avg_second_half_scoring_home
    description: |
      Average home team second half points
      - "Average second half scoring by home teams."
      - "Useful for analyzing halftime adjustments and late-game performance."
    sql: 'AVG({second_half_points_home})'

  - name: avg_first_half_scoring_away
    description: |
      Average away team first half points
      - "Average first half scoring by away teams."
      - "Useful for analyzing game starts and early performance."
    sql: 'AVG({first_half_points_away})'

  - name: avg_second_half_scoring_away
    description: |
      Average away team second half points
      - "Average second half scoring by away teams."
      - "Useful for analyzing halftime adjustments and late-game performance."
    sql: 'AVG({second_half_points_away})'

  - name: overtime_games_count
    description: |
      Count of games with overtime (either team scored in OT1)  
      - "Counts games that went to overtime."
      - "Useful for analyzing game competitiveness and overtime frequency."
    sql: 'SUM(CASE WHEN COALESCE({pts_ot1_home}, 0) > 0 OR COALESCE({pts_ot1_away}, 0) > 0 THEN 1 ELSE 0 END)'

  - name: strong_fourth_quarter_teams_home
    description: |
      Count of home team performances with 30+ points in Q4
      - "Counts home team games with strong 4th quarter performance (30+ points)."
      - "Useful for identifying clutch teams and late-game execution."
    sql: 'SUM(CASE WHEN {pts_qtr4_home} >= 30 THEN 1 ELSE 0 END)'

  - name: strong_fourth_quarter_teams_away
    description: |
      Count of away team performances with 30+ points in Q4
      - "Counts away team games with strong 4th quarter performance (30+ points)."
      - "Useful for identifying clutch teams and late-game execution."
    sql: 'SUM(CASE WHEN {pts_qtr4_away} >= 30 THEN 1 ELSE 0 END)'

  # Team Performance Metrics
  - name: avg_point_differential
    description: |
      Average point differential (home team points - away team points)
      - "Positive values indicate home team advantage."
      - "Use to analyze home court advantage and team dominance."
    sql: 'AVG({pts_home} - {pts_away})'

  # Shooting Efficiency Metrics
  - name: avg_field_goal_percentage
    description: |
      Average field goal percentage across both teams
      - "Metrics overall shooting efficiency in games."
      - "Higher percentages indicate better offensive execution."
    sql: 'AVG(({fg_pct_home} + {fg_pct_away}) / 2)'

  - name: avg_three_point_percentage
    description: |
      Average three-point percentage across both teams
      - "Metrics three-point shooting efficiency."
      - "Note: Some fg3_pct fields may be stored as strings."
    sql: 'AVG((CAST({fg3_pct_home} AS DECIMAL) + CAST({fg3_pct_away} AS DECIMAL)) / 2)'

  # Game Pace Metrics
  - name: avg_possessions
    description: |
      Average possessions per game (home + away teams)
      - "Estimates game pace using field goal attempts and free throw attempts."
      - "Higher values indicate faster-paced games."
    sql: 'AVG(({fga_home} + {fga_away}) + 0.44 * ({fta_home} + {fta_away}))'

  # Defensive Metrics
  - name: avg_total_rebounds
    description: |
      Average total rebounds per game (home + away teams)
      - "Metrics overall rebounding activity in games."
    sql: 'AVG({reb_home} + {reb_away})'

  - name: avg_total_assists
    description: |
      Average total assists per game (home + away teams)
      - "Metrics ball movement and team play."
    sql: 'AVG({ast_home} + {ast_away})'

  # Dunk-related Metrics
  - name: total_dunks_across_games
    description: |
      Total dunks across all games
      - "Aggregates total dunks across game groups."
      - "Useful for analyzing dunk trends by season, team, or game type."
    sql: 'SUM({total_dunks_in_game})'

  - name: avg_dunks
    description: |
      Average dunks per game
      - "Metrics average dunk frequency per game."
      - "Useful for analyzing dunk trends over time."
    sql: 'AVG({total_dunks_in_game})'

  - name: avg_players_with_dunks_per_game
    description: |
      Average number of players with dunks per game
      - "Metrics average participation in dunking per game."
      - "Useful for analyzing dunk culture and participation."
    sql: 'AVG({players_with_dunks_in_game})'

  - name: high_dunk_games_percentage
    description: |
      Percentage of games with 10+ dunks
      - "Metrics the proportion of high-dunk games."
      - "Useful for analyzing dunk excitement levels."
    sql: 'AVG(CASE WHEN {total_dunks_in_game} >= 10 THEN 1 ELSE 0 END) * 100'

  - name: max_dunks_in_any_game
    description: |
      Maximum dunks in any single game
      - "Finds the highest dunk count in any game."
      - "Useful for identifying exceptional dunk performances."
    sql: 'MAX({total_dunks_in_game})'

  # Win/Loss Analysis
  - name: home_win_percentage
    description: |
      Percentage of games won by home teams
      - "Metrics home court advantage effectiveness."
      - "Values above 50% indicate home court advantage."
    sql: |
      AVG(CASE WHEN {wl_home} = 'W' THEN 1 ELSE 0 END) * 100

  # Game Duration Analysis
  - name: avg_game_minutes
    description: |
      Average minutes played per game
      - "Metrics actual game duration in minutes."
      - "Useful for scheduling and broadcast planning."
    sql: 'AVG({min})'

  # Team Win-Loss Metrics for SQL Examples
  - name: total_away_wins
    description: |
      Total wins for teams playing away
      - "Counts total away wins for win-loss analysis."
    sql: |
      SUM(CASE WHEN {wl_away} = 'W' THEN 1 ELSE 0 END)

  - name: total_away_losses
    description: |
      Total losses for teams playing away
      - "Counts total away losses for win-loss analysis."
    sql: |
      SUM(CASE WHEN {wl_away} = 'L' THEN 1 ELSE 0 END)

  - name: total_home_wins
    description: |
      Wins per team per season
      - "Seasonal win totals for team performance analysis."
    sql: |
      SUM(CASE WHEN {wl_home} = 'W' THEN 1 ELSE 0 END)

  - name: total_home_losses
    description: |
      Losses per team per season
      - "Seasonal loss totals for team performance analysis."
    sql: |
      SUM(CASE WHEN {wl_home} = 'L' THEN 1 ELSE 0 END)

  - name: away_win_percentage
    description: |
      Away game win percentage
      - "Metrics performance away from home court."
    sql: |
      AVG(CASE WHEN {wl_away} = 'W' THEN 1.0 ELSE 0.0 END)

  # Home Court Advantage Analysis
  - name: home_court_advantage
    description: |
      Difference between home and away win percentages
      - "Quantifies home court advantage effect."
    sql: |
      (AVG(CASE WHEN {wl_home} = 'W' THEN 1.0 ELSE 0.0 END) - 
          AVG(CASE WHEN {wl_away} = 'W' THEN 1.0 ELSE 0.0 END))

  # Advanced Analytics Metrics
  - name: avg_attendance
    description: |
      Average game attendance
      - "Metrics fan engagement through attendance."
    sql: 'AVG({attendance})'

  - name: max_attendance
    description: |
      Maximum game attendance
      - "Tracks peak attendance figures."
    sql: 'MAX({attendance})'

  - name: avg_margin_of_victory
    description: |
      Average margin of victory (absolute point differential)
      - "Metrics competitiveness of games."
    sql: 'AVG(ABS({pts_home} - {pts_away}))'

  # Close Game Analytics
  - name: close_game_wins_home
    description: |
      Number of close game wins (≤5 points) for home teams
      - "Metrics clutch performance in tight games."
    sql: 'SUM(CASE WHEN ABS({pts_home} - {pts_away}) <= 5 AND {pts_home} > {pts_away} THEN 1 ELSE 0 END)'

  - name: close_game_losses_home
    description: |
      Number of close game losses (≤5 points) for home teams
      - "Tracks close game losses for clutch analysis."
    sql: 'SUM(CASE WHEN ABS({pts_home} - {pts_away}) <= 5 AND {pts_home} < {pts_away} THEN 1 ELSE 0 END)'

  - name: total_close_games_home
    description: |
      Total number of close games (≤5 points) for home teams
      - "Counts total close game experiences."
    sql: 'SUM(CASE WHEN ABS({pts_home} - {pts_away}) <= 5 THEN 1 ELSE 0 END)'

  # Team Performance Metrics
  - name: avg_offensive_rating
    description: |
      Average points scored per game (offensive rating)
      - "Metrics offensive efficiency."
    sql: 'AVG({pts_home})'

  - name: avg_defensive_rating
    description: |
      Average points allowed per game (defensive rating)
      - "Metrics defensive efficiency."
    sql: 'AVG({pts_away})'

  - name: net_rating
    description: |
      Net rating (offensive rating minus defensive rating)
      - "Overall team efficiency metric."
    sql: 'AVG({pts_home}) - AVG({pts_away})'

  # Season Type Specific Metrics
  - name: regular_season_wins
    description: |
      Total wins in regular season games
      - "Counts wins specifically in regular season."
    sql: |
      SUM(CASE WHEN {season_type} = 'Regular Season' AND {wl_home} = 'W' THEN 1 ELSE 0 END)

  - name: regular_season_games
    description: |
      Total games played in regular season
      - "Counts total regular season games."
    sql: |
      SUM(CASE WHEN {season_type} = 'Regular Season' THEN 1 ELSE 0 END)

  - name: playoff_wins
    description: |
      Total wins in playoff games
      - "Counts wins specifically in playoffs."
    sql: |
      SUM(CASE WHEN {season_type} = 'Playoffs' AND {wl_home} = 'W' THEN 1 ELSE 0 END)

  - name: playoff_games
    description: |
      Total games played in playoffs
      - "Counts total playoff games."
    sql: |
      SUM(CASE WHEN {season_type} = 'Playoffs' THEN 1 ELSE 0 END)

  - name: last_game_date
    description: |
      Date of the most recent game
      - "Tracks most recent game activity."
    sql: 'MAX({game_date})'

  # Other Stats Metrics (from nba.public.other_stats)
  - name: avg_points_off_turnovers
    description: |
      Average points scored off turnovers per game
      - "Metrics average points scored off opponent turnovers."
      - "Useful for analyzing defensive pressure and transition offense."
    sql: 'AVG({points_off_turnovers})'

  - name: avg_second_chance_points
    description: |
      Average second chance points per game
      - "Metrics average points scored on second chance opportunities."
      - "Useful for analyzing offensive rebounding effectiveness."
    sql: 'AVG({second_chance_points})'

  - name: avg_fast_break_points
    description: |
      Average fast break points per game
      - "Metrics average points scored in fast break situations."
      - "Useful for analyzing pace and transition offense."
    sql: 'AVG({fast_break_points})'

  # Game Status Metrics (from game_summary)
  - name: live_games_count
    description: |
      Count of games that are currently live
      - "Counts games that are currently in progress."
      - "Useful for real-time game tracking."
    sql: 'SUM(CASE WHEN {is_live_game} THEN 1 ELSE 0 END)'

  - name: final_games_count
    description: |
      Count of games that are final/completed
      - "Counts games that have been completed."
      - "Useful for analyzing completed game statistics."
    sql: 'SUM(CASE WHEN {is_final_game} THEN 1 ELSE 0 END)'

  - name: scheduled_games_count
    description: |
      Count of games that are scheduled but not yet started
      - "Counts games that are scheduled for future play."
      - "Useful for upcoming game analysis."
    sql: 'SUM(CASE WHEN {is_scheduled_game} THEN 1 ELSE 0 END)'

  - name: nationally_televised_games_count
    description: |
      Count of nationally televised games
      - "Counts games that are broadcast on national TV."
      - "Useful for analyzing TV coverage and marquee matchups."
    sql: 'SUM(CASE WHEN {is_nationally_televised} THEN 1 ELSE 0 END)'

  - name: nationally_televised_games_percentage
    description: |
      Percentage of games that are nationally televised
      - "Calculates the percentage of games with national TV coverage."
      - "Useful for analyzing broadcast distribution."
    sql: 'AVG(CASE WHEN {is_nationally_televised} THEN 100.0 ELSE 0.0 END)'

  - name: avg_game_sequence
    description: |
      Average game sequence number
      - "Calculates average game sequence number."
      - "Useful for analyzing game ordering patterns."
    sql: 'AVG({game_sequence})'


