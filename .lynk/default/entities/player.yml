# Formula Features for Analytics

- type: formula
  data_type: boolean
  name: is_high_volume_shooter
  description: Player who attempts high volume of shots (>15 FGA per game average)
  sql: |
    case when {career_points} / NULLIF({career_games}, 0) >= 15 then true else false end

- type: formula
  data_type: boolean
  name: is_efficient_scorer
  description: Player with good scoring efficiency (>50% career TS%)
  sql: |
    case when {career_true_shooting} >= 50 then true else false end

- type: formula
  data_type: boolean
  name: is_versatile_player
  description: Player with high statistical versatility (versatility score >3)
  sql: |
    case when {career_versatility_score} >= 3 then true else false end

- type: formula
  data_type: string
  name: player_role_type
  description: Player role based on starter vs bench games
  sql: |
    case 
      when {starter_games_count} > {bench_games_count} then 'Starter'
      when {bench_games_count} > {starter_games_count} then 'Bench Player'
      else 'Role Player'
    end

- type: formula
  data_type: string
  name: usage_tier
  description: Player usage tier based on estimated usage rate
  sql: |
    case 
      when {career_usage_rate} >= 30 then 'Superstar Usage (30%+)'
      when {career_usage_rate} >= 25 then 'Star Usage (25-30%)'
      when {career_usage_rate} >= 20 then 'High Usage (20-25%)'
      when {career_usage_rate} >= 15 then 'Medium Usage (15-20%)'
      else 'Low Usage (<15%)'
    end

- type: formula
  data_type: string
  name: scoring_tier
  description: Player scoring tier based on career points per game
  sql: |
    case 
      when ({career_points} / NULLIF({career_games}, 0)) >= 25 then 'Elite Scorer (25+ PPG)'
      when ({career_points} / NULLIF({career_games}, 0)) >= 20 then 'Star Scorer (20-25 PPG)'
      when ({career_points} / NULLIF({career_games}, 0)) >= 15 then 'Good Scorer (15-20 PPG)'
      when ({career_points} / NULLIF({career_games}, 0)) >= 10 then 'Role Scorer (10-15 PPG)'
      else 'Low Scorer (<10 PPG)'
    end

# Dunk-related Formulas
- type: formula
  data_type: boolean
  name: is_high_dunker
  description: Player who averages 1+ dunks per game
  sql: |
    case when {avg_dunks_per_game} >= 1.0 then true else false end

- type: formula
  data_type: boolean
  name: is_occasional_dunker
  description: Player who dunks in at least 20% of their games
  sql: |
    case when {dunk_game_percentage} >= 20.0 then true else false end

- type: formula
  data_type: string
  name: dunk_tier
  description: Player dunk tier based on career dunk performance
  sql: |
    case 
      when {avg_dunks_per_game} >= 2.0 then 'Elite Dunker (2+ DPG)'
      when {avg_dunks_per_game} >= 1.0 then 'High Dunker (1-2 DPG)'
      when {avg_dunks_per_game} >= 0.5 then 'Regular Dunker (0.5-1 DPG)'
      when {avg_dunks_per_game} >= 0.1 then 'Occasional Dunker (0.1-0.5 DPG)'
      else 'Rare Dunker (<0.1 DPG)'
    end

- type: formula
  data_type: string
  name: dunk_consistency
  description: Player dunk consistency based on game percentage
  sql: |
    case 
      when {dunk_game_percentage} >= 60 then 'Very Consistent (60%+)'
      when {dunk_game_percentage} >= 40 then 'Consistent (40-60%)'
      when {dunk_game_percentage} >= 20 then 'Occasional (20-40%)'
      when {dunk_game_percentage} >= 5 then 'Rare (5-20%)'
      else 'Very Rare (<5%)'
    end


metrics:

# Player Count Metrics
- name: count_players
  description: |
    Count of players
    - "Use for analyzing player population and demographics."
    - "Filter by is_active to separate current vs former players."
  sql: 'COUNT(*)'

- name: active_player_percentage
  description: |
    Percentage of players who are currently active
    - "Metrics the proportion of currently active players."
    - "Values range from 0-100%."
  sql: 'AVG({is_active}) * 100'

# Name Analysis Metrics
- name: avg_name_length
  description: |
    Average length of player full names
    - "Metrics the average character length of player full names."
    - "Useful for UI design and display formatting."
  sql: 'AVG(LENGTH({full_name}))'

- name: distinct_first_names
  description: |
    Count of unique first names
    - "Metrics the diversity of player first names."
    - "Useful for demographic analysis."
  sql: 'COUNT(DISTINCT {first_name})'

# Physical Attributes Metrics
- name: avg_player_height
  description: | 
    Average height in inches across NBA players
    - "Metrics average physical attributes for positional analysis."
    - "Filter out zero or null values for accurate calculations."
  sql: 'AVG({height_inches})'

- name: avg_player_weight
  description: | 
    Average weight in pounds across NBA players
    - "Metrics average weight for positional and physical analysis."
    - "Useful for understanding physical requirements by position."
  sql: 'AVG({weight_pounds})'

# Career Performance Metrics for SQL Examples
- name: avg_career_points
  description: | 
    Average career points scored by players
    - "Metrics career scoring performance."
    - "Useful for evaluating player success metrics."
  sql: 'AVG({career_points})'

- name: avg_career_games
  description: |
    Average career games played by players
    - "Metrics career longevity."
    - "Useful for analyzing player durability."
  sql: 'AVG({career_games})'

- name: avg_points
  description: Average point
  sql: 'AVG({avg_shooting_percentage})'

- name: avg_points_per_game_career
  description: |
    Average points per game across all players
    - "Metrics average scoring efficiency across players."
    - "Useful for comparing positional scoring expectations."
  sql: 'AVG({avg_points_per_game})'

- name: avg_career_three_point_rate
  description: |
    Average career three-point attempt rate across players
    - "Metrics average three-point usage by position."
    - "Useful for analyzing positional shooting trends."
  sql: 'AVG({career_three_point_rate})'

- name: avg_career_three_point_percentage
  description: |
    Average career three-point shooting percentage across players
    - "Metrics average three-point efficiency by position."
    - "Useful for comparing positional shooting accuracy."
  sql: 'AVG({career_three_point_percentage})'
# International Player Analysis Metrics
- name: international_players_count
  description: |
    Count of international players (players with no college listed)
    - "Aggregates international player counts by year."
    - "Uses the international_players metric from draft entity."
  sql: 'SUM({international_players})'

- name: international_player_percentage
  description: |
    Percentage of international players drafted each year
    - "Calculates the percentage of international players per draft year."
    - "Useful for analyzing global talent trends in NBA drafts."
  sql: '(SUM({international_players}) * 100.0 / COUNT(*))'

# Career Achievement Totals
- name: total_career_double_doubles
  description: |
    Total double-doubles achieved across all players
    - "Aggregates double-double achievements across player groups."
    - "Useful for positional and demographic analysis of versatile players."
  sql: 'SUM({career_double_doubles})'

- name: total_career_triple_doubles
  description: |
    Total triple-doubles achieved across all players
    - "Aggregates triple-double achievements across player groups."
    - "Useful for analyzing elite versatility by position or era."
  sql: 'SUM({career_triple_doubles})'

- name: total_career_games_played
  description: |
    Total games played across all players
    - "Aggregates total games played across player groups."
    - "Useful for calculating rates and analyzing playing time distribution."
  sql: 'SUM({career_games})'

# Performance Rate Calculations
- name: double_double_rate_percentage
  description: | 
    Percentage rate of double-doubles per game across players
    - "Calculates the overall double-double rate as a percentage."
    - "Shows how frequently players achieve double-doubles by group."
  sql: 'ROUND(SUM({career_double_doubles}) * 100.0 / NULLIF(SUM({career_games}), 0), 2)'

- name: triple_double_rate_percentage
  description: | 
    Percentage rate of triple-doubles per game across players
    - "Calculates the overall triple-double rate as a percentage."
    - "Shows how frequently players achieve triple-doubles by group."
  sql: 'ROUND(SUM({career_triple_doubles}) * 100.0 / NULLIF(SUM({career_games}), 0), 2)'

# Draft Combine Aggregate Metrics
- name: avg_combine_height_metric
  description: | 
    Average height measurement across players (aggregated)
    - "Aggregates average combine height measurements across player groups."
    - "Useful for analyzing physical trends by draft year or position."
  sql: 'AVG({avg_combine_height})'

- name: avg_combine_wingspan_metric
  description: |
    Average wingspan measurement across players (aggregated)
    - "Aggregates average wingspan measurements across player groups."
    - "Useful for analyzing physical attributes by position or draft era."
  sql: 'AVG({avg_combine_wingspan})'

- name: avg_combine_vertical_metric
  description: |
    Average vertical leap measurement across players (aggregated)
    - "Aggregates average vertical leap measurements across player groups."
    - "Useful for analyzing athletic ability trends."
  sql: 'AVG({avg_combine_vertical})'

- name: avg_combine_reach_metric
  description: |
    Average standing reach measurement across players (aggregated)
    - "Aggregates average standing reach measurements across player groups."
    - "Useful for analyzing reach and length by position."
  sql: 'AVG({avg_combine_reach})'

# Dunk-related Metrics
- name: total_dunks_across_players
  description: |
    Total dunks across all players
    - "Aggregates total dunks across player groups."
    - "Useful for analyzing dunk trends by position, team, or era."
  sql: 'SUM({career_dunks})'

- name: avg_dunks_per_player
  description: |
    Average dunks per player across the group
    - "Metrics average dunk performance across player groups."
    - "Useful for comparing positional dunk expectations."
  sql: 'AVG({career_dunks})'

- name: avg_dunk_rate_per_game
  description: |
    Average dunk rate per game across players
    - "Metrics average dunk frequency across player groups."
    - "Useful for analyzing dunk trends by position or era."
  sql: 'AVG({avg_dunks_per_game})'

- name: high_dunker_percentage
  description: |
    Percentage of players who are high dunkers (1+ DPG)
    - "Metrics the proportion of high dunkers in a group."
    - "Useful for analyzing dunk culture by position or team."
  sql: 'AVG(CASE WHEN {is_high_dunker} THEN 1 ELSE 0 END) * 100'

- name: occasional_dunker_percentage
  description: |
    Percentage of players who dunk occasionally (20%+ games)
    - "Metrics the proportion of occasional dunkers in a group."
    - "Useful for analyzing dunk participation rates."
  sql: 'AVG(CASE WHEN {is_occasional_dunker} THEN 1 ELSE 0 END) * 100'

examples:
- type: SQL
  name: players_longest_names
  description: Player names with longest length
  input: Who are the players with the longest names?
  expected_output: |
    SELECT 
      full_name,
      LENGTH(full_name) as name_length
    FROM entity('player')
    ORDER BY name_length DESC
    LIMIT 10;
  tags:
    difficulty: EASY

- type: SQL
  name: total_player_count
  description: Total player count using metrics
  input: How many total players are in the dataset?
  expected_output: |
    SELECT 
      metric(count_players) as total_players
    FROM entity('player');
  tags:
    difficulty: EASY

- type: SQL
  name: avg_height_weight_by_position
  description: Average player height and weight by position
  input: What are the average height and weight of NBA players by position?
  expected_output: |
    SELECT  
      position,
      metric(avg_player_height) as avg_height_inches,
      metric(avg_player_weight) as avg_weight_pounds,
      metric(count_players) as player_count
    FROM entity('player')
    WHERE position IS NOT NULL
    GROUP BY position
    ORDER BY avg_height_inches DESC;
  tags:
    difficulty: EASY

- type: SQL
  name: top_career_dunkers
  description: Top dunkers by career dunks
  input: Who are the top 10 players with the most career dunks?
  expected_output: |
    SELECT 
      full_name,
      career_dunks,
      avg_dunks_per_game,
      dunk_game_percentage,
      max_dunks_in_game
    FROM entity('player')
    WHERE career_dunks > 0
    ORDER BY career_dunks DESC
    LIMIT 10;
  tags:
    difficulty: EASY

- type: SQL
  name: dunk_performance_by_position
  description: Dunk performance by position
  input: What are the average dunks per game by position?
  expected_output: |
    SELECT 
      position,
      metric(avg_dunk_rate_per_game) as avg_dunks_per_game,
      metric(high_dunker_percentage) as high_dunker_pct,
      metric(count_players) as player_count
    FROM entity('player')
    WHERE position IS NOT NULL
    GROUP BY position
    ORDER BY avg_dunks_per_game DESC;
  tags:
    difficulty: MEDIUM

