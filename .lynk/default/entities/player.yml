# Formula Features - Calculated Fields
- type: formula
  data_type: number
  name: height_inches
  description: Player height converted from feet-inches format (e.g., "6-10") to total
    inches
  sql: |
    CASE
        WHEN {height} IS NOT NULL AND {height} LIKE '%-%' THEN
            TRY_CAST(SPLIT_PART({height}, '-', 1) AS INTEGER) * 12 +
            TRY_CAST(SPLIT_PART({height}, '-', 2) AS INTEGER)
        ELSE NULL
    END

- type: formula
  data_type: boolean
  name: is_rookie
  description: Whether the player is a rookie (0 years experience)
  sql: |
    case when coalesce(cast({experience} as number), 0) = 0 then true else false
    end

- type: formula
  name: position
  description: Player position cleaned and standardized
  data_type: string
  sql: |
    case 
        when upper(trim({position_raw})) = 'GUARD' then 'G'
        when upper(trim({position_raw})) = 'FORWARD' then 'F'
        when upper(trim({position_raw})) = 'CENTER' then 'C'
        when upper(trim({position_raw})) in ('FORWARD-GUARD', 'GUARD-FORWARD') then 'F-G'
        when upper(trim({position_raw})) in ('POINT-GUARD', 'SHOOTING-GUARD', 'GUARD-POINT') then 'G'
        when upper(trim({position_raw})) in ('CENTER-FORWARD', 'FORWARD-CENTER') then 'C-F'
        else upper(trim({position_raw}))
    end

- type: formula
  data_type: string
  name: experience_bracket
  description: Experience level category based on years in NBA
  sql: |
    case 
      when {experience} <= 2 then 'Rookie/Sophomore (0-2 years)'
      when {experience} <= 5 then 'Young Player (3-5 years)'
      when {experience} <= 10 then 'Veteran (6-10 years)'
      else 'Long-term Veteran (10+ years)'
    end

- type: formula
  data_type: string
  name: draft_tier
  description: Draft position tier category for value analysis
  sql: |
    case 
      when {draft_position} <= 5 then 'Top 5'
      when {draft_position} <= 14 then 'Lottery (6-14)'
      when {draft_position} <= 30 then 'First Round (15-30)'
      else 'Second Round (30+)'
    end

