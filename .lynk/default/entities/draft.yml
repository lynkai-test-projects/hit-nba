# Draft History Formula Fields
- type: formula
  name: draft_season_year
  data_type: datetime
  description: Draft year as a date format
  sql: 'TO_DATE(CAST({draft_year} AS VARCHAR), ''YYYY'')'

- type: formula
  name: is_first_round
  data_type: boolean
  description: Whether the pick was in the first round (round 1)
  sql: 'case when coalesce({draft_round},0)=1 then true else false end'

- type: formula
  name: is_lottery_pick
  data_type: boolean
  description: Whether the pick was a lottery pick (picks 1-14)
  sql: 'case when coalesce({draft_position},0) between 1 and 14 then true else false end'

metrics:

# asset asset Metrics
- name: avg_height_no_shoes
  description: |
    Average height without shoes.
    - "Calculates average height without shoes across records."
    - "Useful for analyzing physical attribute trends."
  sql: 'AVG({height_wo_shoes})'

- name: avg_wingspan
  description: |
    Average wingspan measurement.
    - "Calculates average wingspan across records."
    - "Useful for analyzing physical attribute trends."
  sql: 'AVG({wingspan})'

- name: avg_vertical_leap
  description: |
    Average maximum vertical leap.
    - "Calculates average maximum vertical leap across records."
    - "Useful for analyzing athletic performance trends."
  sql: 'AVG({max_vertical_leap})'

- name: avg_standing_reach
  description: |
    Average standing reach measurement.
    - "Calculates average standing reach across records."
    - "Useful for analyzing physical attribute trends."
  sql: 'AVG({standing_reach})'

- name: avg_body_fat
  description: |
    Average body fat percentage.
    - "Calculates average body fat percentage across records."
    - "Useful for analyzing physical composition trends."
  sql: 'AVG({body_fat_pct})'

# Counting Metrics
- name: count_drafts
  description: |
    Count of draft records (player-season combinations).
    - "Use for analyzing draft data coverage and activity."
    - "Filter by season to analyze combine participation by year."
    - "Filter by player_id to analyze individual player combine history."
  sql: 'COUNT(*)'

# Player Analysis Metrics
- name: distinct_players
  description: |
    Count of distinct players with combine data.
    - "Counts unique players in the dataset."
    - "Useful for analyzing combine participation."
  sql: 'COUNT(DISTINCT {player_id})'

# Season Analysis Metrics
- name: distinct_seasons
  description: |
    Count of distinct seasons with combine data.
     - "Counts unique seasons in the dataset."
     - "Useful for analyzing temporal coverage."
  sql: 'COUNT(DISTINCT {season})'

- name: avg_draft_position
  description: |
    Average overall draft pick position.
    - "Calculates average draft position across records."
    - "Useful for analyzing draft quality trends."
  sql: 'AVG({draft_position})'

- name: first_round_picks
  description: |
    Count of first round picks.
    - "Counts picks in the first round (round 1)."
    - "Useful for analyzing first round participation."
  sql: 'SUM(CASE WHEN {is_first_round} THEN 1 ELSE 0 END)'

- name: lottery_picks_count
  description: |
    Count of lottery picks (1-14).
    - "Counts picks in lottery range (picks 1-14)."
    - "Useful for analyzing lottery pick participation."
  sql: 'SUM(CASE WHEN {is_lottery_pick} THEN 1 ELSE 0 END)'

- name: first_round_percentage
  description: |
    Percentage of picks that were first round.
    - "Calculates percentage of first round picks."
    - "Useful for analyzing draft round distribution."
  sql: 'AVG(CASE WHEN {is_first_round} THEN 1.0 ELSE 0.0 END)'

- name: lottery_percentage
  description: |
    Percentage of picks that were lottery picks.
    - "Calculates percentage of lottery picks."
    - "Useful for analyzing lottery participation rates."
  sql: 'AVG(CASE WHEN {is_lottery_pick} THEN 1.0 ELSE 0.0 END)'

- name: earliest_pick
  description: |
    Highest (earliest) overall pick number.
    - "Finds the earliest (best) draft pick."
    - "Useful for identifying top draft selections."
  sql: 'MIN({draft_position})'

- name: latest_pick
  description: |
    Lowest (latest) overall pick number.
    - "Finds the latest (worst) draft pick."
    - "Useful for identifying late draft selections."
  sql: 'MAX({draft_position})'

- name: international_players
  description: |
    Count of international players (non-College/University organization type).
    - "Counts players from non-college backgrounds."
    - "Useful for analyzing international draft participation."
  sql: 'SUM(CASE WHEN UPPER({organization_type}) <> ''COLLEGE/UNIVERSITY'' THEN 1 ELSE 0 END)'

examples:
- type: SQL
  description: Player combine stats for a specific season
  input: What are the combine statistics for players in the 2023 season?
  expected_output: |
    SELECT 
      player_name,
      season,
      height_wo_shoes,
      wingspan,
      max_vertical_leap,
      standing_reach,
      body_fat_pct
    FROM entity('draft')
    WHERE season = 2023
    ORDER BY player_name;
  tags:
    difficulty: EASY

- type: SQL
  description: Player combine history
  input: Show me the combine statistics for a specific player across all seasons
  expected_output: |
    SELECT 
      player_name,
      season,
      height_wo_shoes,
      wingspan,
      max_vertical_leap,
      standing_reach,
      body_fat_pct
    FROM entity('draft')
    WHERE player_id = [player_id]
    ORDER BY season DESC;
  tags:
    difficulty: EASY

- type: SQL
  description: Average physical attributes by season
  input: What are the average combine measurements by season?
  expected_output: |
    SELECT 
      season,
      metric(avg_height_no_shoes) as avg_height,
      metric(avg_wingspan) as avg_wingspan,
      metric(avg_vertical_leap) as avg_vertical,
      metric(count_drafts) as player_count
    FROM entity('draft')
    GROUP BY season
    ORDER BY season DESC;
  tags:
    difficulty: MEDIUM

related_sources: 
  nba.public.draft_history:    
    description:  NBA Draft history records showing draft selections, pick numbers, and team selections.
    relationship: one_to_one    
    joins:    
    - name: draft_to_draft_history      
      default: true      
      type: fields      
      fields:      
      - source: player_id        
        destination: person_id        
        operator: equal  
      - source: season        
        destination: season        
        operator: equal  
