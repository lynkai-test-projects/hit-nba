metrics:

# Team Count Metrics
- name: count_teams
  description: |
    Count of teams
    - "Use for analyzing team distribution and demographics."
    - "Filter by state for geographic analysis."
  sql: 'COUNT(*)'

# Franchise Age Metrics
- name: avg_franchise_age
  description: |
    Average age of NBA franchises (years since founding)
    - "Metrics the average longevity of NBA franchises."
    - "Higher values indicate older, more established teams."
  sql: 'AVG(EXTRACT(YEAR FROM CURRENT_DATE) - {year_founded})'

- name: oldest_franchise_year
  description: |
    Founding year of the oldest NBA franchise
    - "Identifies the founding year of the oldest franchise."
    - "Useful for historical analysis."
  sql: 'MIN({year_founded})'

# Name Analysis Metrics
- name: avg_team_name_length
  description: |
    Average length of team full names
    - "Metrics the average character length of team full names."
    - "Useful for UI design and display formatting."
  sql: 'AVG(LENGTH({full_name}))'

- name: distinct_cities
  description: |
    Count of unique cities with NBA teams
    - "Metrics the geographic diversity of NBA teams."
    - "Useful for market analysis."
  sql: 'COUNT(DISTINCT {city})'

# Player Count Metrics  
- name: count_players
  description: |
    Count of unique players associated with this team
    - "Counts unique players who have been affiliated with this team."
    - "Uses player_team relationship to count distinct players."
    - "Useful for analyzing team roster history and player development."
  sql: 'COUNT(DISTINCT {person_id})'

# Dunk-related Metrics
- name: total_dunks_across_teams
  description: |
    Total dunks across all teams
    - "Aggregates total dunks across team groups."
    - "Useful for analyzing dunk trends by conference, division, or era."
  sql: 'SUM({total_team_dunks})'

- name: avg_dunks_per_team
  description: |
    Average dunks per team
    - "Metrics average dunk performance across teams."
    - "Useful for comparing team dunk cultures."
  sql: 'AVG({total_team_dunks})'

- name: avg_dunk_rate_per_team_game
  description: |
    Average dunk rate per game across teams
    - "Metrics average dunk frequency per game across teams."
    - "Useful for analyzing team playing styles."
  sql: 'AVG({avg_dunks_team})'

- name: high_dunk_team_percentage
  description: |
    Percentage of teams with high dunk rates (1+ DPG)
    - "Metrics the proportion of high-dunk teams."
    - "Useful for analyzing dunk culture across the league."
  sql: 'AVG(CASE WHEN {avg_dunks_team} >= 1.0 THEN 1 ELSE 0 END) * 100'

- name: max_dunks_by_any_team_player
  description: |
    Maximum dunks by any player on any team
    - "Finds the highest dunk count by any team player."
    - "Useful for identifying exceptional team dunk performances."
  sql: 'MAX({max_dunks_by_team_player})'

# Arena and Facility Metrics
- name: avg_arena_capacity
  description: |
    Average arena capacity across all teams
    - "Metrics the average seating capacity of NBA arenas."
    - "Useful for analyzing facility sizes and market sizes."
  sql: 'AVG({arena_capacity})'

- name: max_arena_capacity
  description: |
    Maximum arena capacity among all teams
    - "Identifies the largest arena in the NBA."
  sql: 'MAX({arena_capacity})'

- name: min_arena_capacity
  description: |
    Minimum arena capacity among all teams
    - "Identifies the smallest arena in the NBA."
  sql: 'MIN({arena_capacity})'

- name: teams_with_large_arenas
  description: |
    Count of teams with large arenas (20,000+ capacity)
    - "Counts teams with arenas in the large category."
  sql: 'SUM(CASE WHEN {arena_capacity} >= 20000 THEN 1 ELSE 0 END)'

# Social Media Metrics
- name: teams_with_social_media
  description: |
    Count of teams with at least one social media account
    - "Metrics social media presence across teams."
  sql: 'SUM(CASE WHEN {has_social_media} THEN 1 ELSE 0 END)'

- name: avg_social_media_accounts
  description: |
    Average number of social media accounts per team
    - "Metrics average social media presence."
  sql: 'AVG({social_media_count})'

- name: teams_with_all_social_media
  description: |
    Count of teams with all three social media accounts (Facebook, Instagram, Twitter)
    - "Identifies teams with complete social media presence."
  sql: 'SUM(CASE WHEN {social_media_count} = 3 THEN 1 ELSE 0 END)'

# G League Affiliation Metrics
- name: teams_with_gleague_affiliate
  description: |
    Count of teams with G League affiliates
    - "Metrics G League affiliation across teams."
  sql: 'SUM(CASE WHEN {has_gleague_affiliate} THEN 1 ELSE 0 END)'

- name: gleague_affiliation_percentage
  description: |
    Percentage of teams with G League affiliates
    - "Calculates the percentage of teams with G League affiliates."
  sql: 'AVG(CASE WHEN {has_gleague_affiliate} THEN 100.0 ELSE 0.0 END)'

related_sources:
  nba.public.team_details:
    relationship: one_to_one
    joins:
    - name: team_id
      default: true
      type: fields
      fields:
      - source: id
        destination: team_id
        operator: equal


examples:
- type: SQL
  name: total_nba_teams_count
  description: Total number of NBA teams
  input: How many teams are there in the NBA?
  expected_output: |
    SELECT 
      COUNT(*) as total_teams
    FROM entity('team');
  tags:
    difficulty: EASY

- type: SQL
  name: team_details_by_id
  description: Team details for specific team ID
  input: What are the team details for team ID 1610612747 (Los Angeles Lakers)?
  expected_output: |
    SELECT 
      id,
      full_name,
      city,
      nickname,
      abbreviation,
      state,
      year_founded
    FROM entity('team')
    WHERE id = 1610612747;
  tags:
    difficulty: EASY

- type: SQL
  name: teams_count_by_state
  description: Count of teams by state
  input: How many teams are in each state?
  expected_output: |
    SELECT 
      state, 
      COUNT(*) as team_count
    FROM entity('team')
    GROUP BY state
    ORDER BY team_count DESC;
  tags:
    difficulty: EASY

- type: SQL
  name: teams_by_founding_year
  description: Teams ordered by founding year
  input: What are the oldest teams in the NBA?
  expected_output: |
    SELECT 
      full_name,
      year_founded
    FROM entity('team')
    ORDER BY year_founded ASC;
  tags:
    difficulty: EASY

- type: SQL
