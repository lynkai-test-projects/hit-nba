    method: first
    sort_by: draft_position
    offset: 1
    field: draft_position
    data_type: number

- type: first_last
  name: most_recent_draft_year
  description: Most recent year this team made a draft pick
  data_type: number
  source: draft
  join_name: team_to_draft
  time_field: null
  filters: []
  options:
    method: last
    sort_by: draft_year
    offset: 1
    field: draft_year
    data_type: number

- type: first_last
  name: most_recent_first_round_pick
  description: Most recent first round draft pick by this team
  data_type: number
  source: draft
  join_name: team_to_draft
  time_field: null
  filters:
  - type: field
    field: draft_round
    operator: equal
    values:
    - 1
  options:
    method: last
    sort_by: draft_year
    offset: 1
    field: player_id
    data_type: number

