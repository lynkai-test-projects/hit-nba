name: team

description: Dimension table containing comprehensive team information, location data, and franchise tags for NBA basketball teams

key_table: nba.public.team

keys:
- id

features:

# Team Identification Fields
- type: field
  name: id
  data_type: number
  source: nba.public.team
  description: Unique identifier for each NBA team
  field: id
  join_name: null
  time_field: null
  filters: []

# Team Name Fields
- type: field
  name: full_name
  data_type: string
  source: nba.public.team
  description: Complete team name (e.g., "Los Angeles Lakers")
  field: full_name
  join_name: null
  time_field: null
  filters: []

- type: field
  name: city
  data_type: string
  source: nba.public.team
  description: City where the team is located (e.g., "Los Angeles")
  field: city
  join_name: null
  time_field: null
  filters: []

- type: field
  name: nickname
  data_type: string
  source: nba.public.team
  description: Team nickname/mascot name (e.g., "Lakers")
  field: nickname
  join_name: null
  time_field: null
  filters: []

- type: field
  name: abbreviation
  data_type: string
  source: nba.public.team
  description: Short team abbreviation (e.g., "LAL")
  field: abbreviation
  join_name: null
  time_field: null
  filters: []

# Geographic Fields
- type: field
  name: state
  data_type: string
  source: nba.public.team
  description: State where the team is located (e.g., "California")
  field: state
  join_name: null
  time_field: null
  filters: []

# Franchise History Fields
- type: field
  name: year_founded
  data_type: number
  source: nba.public.team
  description: Year when the team was founded (e.g., 1947)
  field: year_founded
  join_name: null
  time_field: null
  filters: []

# Team Details Fields (from team_details asset)
- type: field
  name: arena
  data_type: string
  source: nba.public.team_details
  description: Name of the team's home arena/stadium
  field: ARENA
  join_name: team_id
  time_field: null
  filters: []

- type: field
  name: arena_capacity
  data_type: number
  source: nba.public.team_details
  description: Seating capacity of the team's home arena
  field: ARENACAPACITY
  join_name: team_id
  time_field: null
  filters: []

- type: field
  name: owner
  data_type: string
  source: nba.public.team_details
  description: Name of the team's owner
  field: OWNER
  join_name: team_id
  time_field: null
  filters: []

- type: field
  name: general_manager
  data_type: string
  source: nba.public.team_details
  description: Name of the team's general manager
  field: GENERALMANAGER
  join_name: team_id
  time_field: null
  filters: []

- type: field
  name: head_coach_name
  data_type: string
  source: nba.public.team_details
  description: Name of the team's head coach
  field: HEADCOACH
  join_name: team_id
  time_field: null
  filters: []

- type: field
  name: dleague_affiliation
  data_type: string
  source: nba.public.team_details
  description: Name of the team's G League (formerly D-League) affiliate
  field: DLEAGUEAFFILIATION
  join_name: team_id
  time_field: null
  filters: []

- type: field
  name: facebook_url
  data_type: string
  source: nba.public.team_details
  description: Team's Facebook page URL
  field: FACEBOOK
  join_name: team_id
  time_field: null
  filters: []

- type: field
  name: instagram_url
  data_type: string
  source: nba.public.team_details
  description: Team's Instagram profile URL
  field: INSTAGRAM
  join_name: team_id
  time_field: null
  filters: []

- type: field
  name: twitter_url
  data_type: string
  source: nba.public.team_details
  description: Team's Twitter/X profile URL
  field: TWITTER
  join_name: team_id
  time_field: null
  filters: []

# Calculated Fields from Team Details
- type: formula
  name: has_social_media
  data_type: boolean
  description: Whether the team has at least one social media account
  sql: |
    CASE 
      WHEN {facebook_url} IS NOT NULL OR {instagram_url} IS NOT NULL OR {twitter_url} IS NOT NULL 
      THEN TRUE 
      ELSE FALSE 
    END

- type: formula
  name: social_media_count
  data_type: number
  description: Number of social media accounts the team has
  sql: |
    (CASE WHEN {facebook_url} IS NOT NULL THEN 1 ELSE 0 END) +
    (CASE WHEN {instagram_url} IS NOT NULL THEN 1 ELSE 0 END) +
    (CASE WHEN {twitter_url} IS NOT NULL THEN 1 ELSE 0 END)

- type: formula
  name: has_gleague_affiliate
  data_type: boolean
  description: Whether the team has a G League affiliate
  sql: |
    CASE 
      WHEN {dleague_affiliation} IS NOT NULL AND TRIM({dleague_affiliation}) != '' 
      THEN TRUE 
      ELSE FALSE 
    END

- type: formula
  name: arena_size_category
  data_type: string
  description: Categorizes arena capacity into size categories
  sql: |
    CASE 
      WHEN {arena_capacity} >= 20000 THEN 'Large (20,000+)'
      WHEN {arena_capacity} >= 18000 THEN 'Medium-Large (18,000-19,999)'
      WHEN {arena_capacity} >= 16000 THEN 'Medium (16,000-17,999)'
      WHEN {arena_capacity} >= 14000 THEN 'Small-Medium (14,000-15,999)'
      WHEN {arena_capacity} IS NOT NULL THEN 'Small (<14,000)'
      ELSE 'Unknown'
    END

# Team Win-Loss Features from team_game entity
- type: metric
  name: total_home_wins
  description: Total wins when playing at home
  data_type: number
  source: team_game
  join_name: null
  time_field: null
  filters: []
  metric: home_wins_count

- type: metric
  name: total_home_losses
  description: Total losses when playing at home
  data_type: number
  source: team_game
  join_name: null
  time_field: null
  filters: []
  metric: home_losses_count

- type: metric
  name: total_away_wins
  description: Total wins when playing away
  data_type: number
  source: team_game
  join_name: null
  time_field: null
  filters: []
  metric: away_wins_count

- type: metric
  name: total_away_losses
  description: Total losses when playing away
  data_type: number
  source: team_game
  join_name: null
  time_field: null
  filters: []
  metric: away_losses_count

# Formula Features for Combined Win-Loss Totals
- type: formula
  data_type: number
  name: total_wins
  description: Total wins across team history (home + away)
  sql: '{total_home_wins} + {total_away_wins}'

- type: formula
  data_type: number
  name: total_losses
  description: Total losses across team history (home + away)
  sql: '{total_home_losses} + {total_away_losses}'

- type: formula
  data_type: number
  name: win_difference
  description: Absolute difference between home and away wins (metric of home/away balance)
  sql: 'ABS({total_home_wins} - {total_away_wins})'

- type: formula
  data_type: number
  name: win_percentage
  description: Overall win percentage across all games (home + away)
  sql: |
    case 
      when {total_wins} + {total_losses} > 0 
      then round({total_wins} * 100.0 / ({total_wins} + {total_losses}), 2)
      else 0 
    end

- type: formula
  data_type: number
  name: total_games
  description: Total games played across team history (home + away)
  sql: '{total_wins} + {total_losses}'

# Draft History Features (from draft entity)
- type: metric
  name: count_drafts
  description: Total number of draft picks made by this team
  data_type: number
  source: draft
  join_name: team_to_draft
  time_field: null
  filters: []
  metric: count_drafts

- type: metric
