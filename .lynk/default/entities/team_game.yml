name: team_game

description: Fact table containing team-level performance statistics for each game, representing aggregated box score data at the team-game level

key_table: nba.public.team_game_stats

keys:
- team_full_name
- game_id

features:

# Game Identification Fields
- type: field
  name: game_id
  data_type: string
  source: nba.public.team_game_stats
  description: Unique identifier for the game
  field: game_id
  join_name: null
  time_field: null
  filters: []

- type: field
  name: game_date
  data_type: datetime
  source: nba.public.team_game_stats
  description: Date and time when the game was played
  field: game_date
  join_name: null
  time_field: null
  filters: []

- type: field
  name: season_year
  data_type: number
  source: nba.public.team_game_stats
  description: NBA season year for the game
  field: season_year
  join_name: null
  time_field: null
  filters: []

# Team Identification Fields
- type: field
  name: team_full_name
  data_type: string
  source: nba.public.team_game_stats
  description: Full name of the team (city and team name combined)
  field: team_full_name
  join_name: null
  time_field: null
  filters: []

- type: field
  name: team_id
  data_type: string
  source: nba.public.team_game_stats
  description: Team id
  field: team_id
  join_name: null
  time_field: null
  filters: []

- type: field
  name: opponent_team_full_name
  data_type: string
  source: nba.public.team_game_stats
  description: Full name of the opposing team (city and team name combined)
  field: opponent_team_full_name
  join_name: null
  time_field: null
  filters: []

# Game Context Fields
- type: field
  name: home
  data_type: boolean
  source: nba.public.team_game_stats
  description: Whether the team was playing at home
  field: home
  join_name: null
  time_field: null
  filters: []

- type: field
  name: win
  data_type: boolean
  source: nba.public.team_game_stats
  description: Whether the team won the game
  field: win
  join_name: null
  time_field: null
  filters: []

- type: field
  name: season_type
  data_type: string
  source: nba.public.team_game_stats
  description: Type of season (Regular Season, Playoffs, etc.)
  field: season_type
  join_name: null
  time_field: null
  filters: []

# Performance Statistics Fields
