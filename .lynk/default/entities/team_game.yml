  source: nba.public.team_game_stats
  description: Total points scored by the team in the game
  field: points
  join_name: null
  time_field: null
  filters: []

- type: field
  name: assists
  data_type: number
  source: nba.public.team_game_stats
  description: Total assists recorded by the team in the game
  field: assists
  join_name: null
  time_field: null
  filters: []

- type: field
  name: rebounds_total
  data_type: number
  source: nba.public.team_game_stats
  description: Total rebounds by the team in the game
  field: rebounds_total
  join_name: null
  time_field: null
  filters: []

- type: field
  name: rebounds_offensive
  data_type: number
  source: nba.public.team_game_stats
  description: Total offensive rebounds by the team in the game
  field: rebounds_offensive
  join_name: null
  time_field: null
  filters: []

- type: field
  name: rebounds_defensive
  data_type: number
  source: nba.public.team_game_stats
  description: Total defensive rebounds by the team in the game
  field: rebounds_defensive
  join_name: null
  time_field: null
  filters: []

- type: field
  name: blocks
  data_type: number
  source: nba.public.team_game_stats
  description: Total blocks recorded by the team in the game
  field: blocks
  join_name: null
  time_field: null
  filters: []

- type: field
  name: steals
  data_type: number
  source: nba.public.team_game_stats
  description: Total steals recorded by the team in the game
  field: steals
  join_name: null
  time_field: null
  filters: []

- type: field
  name: turnovers
  data_type: number
  source: nba.public.team_game_stats
  description: Total turnovers by the team in the game
  field: turnovers
  join_name: null
  time_field: null
  filters: []

# Field Goal Statistics
- type: field
  name: field_goals_attempted
  data_type: number
  source: nba.public.team_game_stats
  description: Total field goal attempts by the team in the game
  field: field_goals_attempted
  join_name: null
  time_field: null
  filters: []

- type: field
  name: field_goals_made
  data_type: number
  source: nba.public.team_game_stats
  description: Total field goals made by the team in the game
  field: field_goals_made
  join_name: null
  time_field: null
  filters: []

- type: field
  name: field_goals_percentage
  data_type: number
  source: nba.public.team_game_stats
  description: Field goal shooting percentage for the team in the game
  field: field_goals_percentage
  join_name: null
